<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cubistry Unified View</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans:wght@600&display=swap">
<style>
/* Layout: header above a clean stage; controls in a fixed dock (right on desktop, bottom sheet on phones).
   The mock bar outside the device frame is not part of the product. */
:root{
  --bg:#f5f3eb; --surface:#fffdf6; --surface-2:#efece2; --line:#dcd7c9;
  --ink:#153b61; --ink-2:#51647a; --accent:#9e0b5c; --on-accent:#ffffff; --accent-soft:#f6e6ee;
  --focus:#c8257e; --tint:#2c5a8a;
  --stage-1:#fbfaf4; --stage-2:#e5dfcf; --shadow:rgba(60,45,20,.40);
  --page:#d8d4c8; --mock:#20242c; --mock-ink:#ebe9e1; --mock-2:#a0a7b3; --mock-line:#3a404b;
  --s-ready:#4f6176; --s-moving:#245e9e; --s-sync:#0b6e68; --s-paused:#7d5900; --s-done:#2b6d36; --s-warn:#984a00; --s-error:#b0261d;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --f-print:"Noto Sans","IBM Plex Sans",system-ui,sans-serif;
  --r-1:6px; --r-2:10px; --r-3:16px; --r-pill:999px;
  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:24px; --sp-6:32px;
  --t-cap:11px; --t-sm:13px; --t-md:15px; --t-lg:20px; --t-xl:28px; --t-2xl:40px;
  --dur-chrome:150ms; --dur-view:260ms; --ease-chrome:cubic-bezier(.2,0,0,1);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#14181f; --surface:#1d2330; --surface-2:#262d3b; --line:#384256;
  --ink:#eceae2; --ink-2:#a9b1be; --accent:#e0569d; --on-accent:#16080f; --accent-soft:#3a1f2e;
  --focus:#ff7ab8; --tint:#8fb4dd;
  --stage-1:#232a38; --stage-2:#12161d; --shadow:rgba(0,0,0,.7);
  --page:#0b0d11; --mock:#05070a; --mock-ink:#ebe9e1; --mock-2:#9aa1ad; --mock-line:#2a303a;
  --s-ready:#a3afbd; --s-moving:#86b5ee; --s-sync:#5ccdc2; --s-paused:#e3b65c; --s-done:#7ccf8a; --s-warn:#f2a65a; --s-error:#ff8d84;
  color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#14181f; --surface:#1d2330; --surface-2:#262d3b; --line:#384256;
  --ink:#eceae2; --ink-2:#a9b1be; --accent:#e0569d; --on-accent:#16080f; --accent-soft:#3a1f2e;
  --focus:#ff7ab8; --tint:#8fb4dd;
  --stage-1:#232a38; --stage-2:#12161d; --shadow:rgba(0,0,0,.7);
  --page:#0b0d11; --mock:#05070a; --mock-ink:#ebe9e1; --mock-2:#9aa1ad; --mock-line:#2a303a;
  --s-ready:#a3afbd; --s-moving:#86b5ee; --s-sync:#5ccdc2; --s-paused:#e3b65c; --s-done:#7ccf8a; --s-warn:#f2a65a; --s-error:#ff8d84;
  color-scheme:dark }
/* The device frame can be forced to one theme from the mock bar or the header */
.device[data-t="light"]{
  --bg:#f5f3eb; --surface:#fffdf6; --surface-2:#efece2; --line:#dcd7c9;
  --ink:#153b61; --ink-2:#51647a; --accent:#9e0b5c; --on-accent:#ffffff; --accent-soft:#f6e6ee;
  --focus:#c8257e; --tint:#2c5a8a; --stage-1:#fbfaf4; --stage-2:#e5dfcf; --shadow:rgba(60,45,20,.40);
  --s-ready:#4f6176; --s-moving:#245e9e; --s-sync:#0b6e68; --s-paused:#7d5900; --s-done:#2b6d36; --s-warn:#984a00; --s-error:#b0261d;
  color-scheme:light }
.device[data-t="dark"]{
  --bg:#14181f; --surface:#1d2330; --surface-2:#262d3b; --line:#384256;
  --ink:#eceae2; --ink-2:#a9b1be; --accent:#e0569d; --on-accent:#16080f; --accent-soft:#3a1f2e;
  --focus:#ff7ab8; --tint:#8fb4dd; --stage-1:#232a38; --stage-2:#12161d; --shadow:rgba(0,0,0,.7);
  --s-ready:#a3afbd; --s-moving:#86b5ee; --s-sync:#5ccdc2; --s-paused:#e3b65c; --s-done:#7ccf8a; --s-warn:#f2a65a; --s-error:#ff8d84;
  color-scheme:dark }

[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--f-ui);font-size:var(--t-md);display:flex;flex-direction:column;overflow:hidden}
*{box-sizing:border-box}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
svg.i{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- mock bar (not product) ---------- */
.mockbar{background:var(--mock);color:var(--mock-ink);display:flex;align-items:center;gap:var(--sp-3);
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  overflow-x:auto;scrollbar-width:none;font-size:var(--t-sm);flex:none}
.mockbar::-webkit-scrollbar{display:none}
.mockbar .tag{font:500 var(--t-cap)/1 var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--mock-2);white-space:nowrap}
.mseg{display:flex;border:1px solid var(--mock-line);border-radius:var(--r-1);overflow:hidden;flex:none}
.mseg button{background:none;border:0;padding:5px 9px;color:var(--mock-2);cursor:pointer;white-space:nowrap}
.mseg button[aria-pressed="true"]{background:var(--mock-line);color:var(--mock-ink)}
.mock-toggle{display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--mock-2);cursor:pointer}
.mock-toggle input{accent-color:#e0569d}
.mockbar a{color:var(--mock-ink);white-space:nowrap}
.mockbar .sep{width:1px;height:18px;background:var(--mock-line);flex:none}

/* ---------- device frame ---------- */
.viewport{flex:1;min-height:0;position:relative;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;align-items:center;justify-content:center}
.devwrap{position:relative;flex:none}
.device{container:dev / size;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:var(--bg);color:var(--ink);
  border-radius:12px;box-shadow:0 0 0 1px var(--line),0 24px 60px -24px rgba(0,0,0,.45)}
.device.phone{border-radius:38px;box-shadow:0 0 0 10px #0e1014,0 0 0 11px #2d323a,0 24px 60px -20px rgba(0,0,0,.5)}
.device.fit{border-radius:14px}

/* ---------- app shell ---------- */
.app{position:absolute;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr)}
.hdr{display:flex;align-items:center;gap:var(--sp-3);padding:12px 16px;min-width:0;position:relative;z-index:5}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);flex:none}
.brand svg{width:28px;height:28px}
.brand{--mark-ink:#153b61}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .device:not([data-t="light"]) .brand{--mark-ink:#8fb4dd}}
:root[data-theme="dark"] .device:not([data-t="light"]) .brand,.device[data-t="dark"] .brand{--mark-ink:#8fb4dd}
.brand b{font:600 14px/1 var(--f-ui);letter-spacing:.16em;text-transform:uppercase}
.swbtn{display:flex;align-items:center;gap:8px;min-width:0;max-width:340px;height:38px;padding:0 12px;border:1px solid var(--line);border-radius:var(--r-pill);background:var(--surface);cursor:pointer}
.swbtn .nm{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swbtn .short{display:none;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.swbtn .meta{font:var(--t-cap)/1 var(--f-num);color:var(--ink-2);white-space:nowrap}
.hdr .grow{flex:1}
.hbtn{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 12px;border-radius:var(--r-pill);border:1px solid transparent;background:none;cursor:pointer;white-space:nowrap;font-size:var(--t-sm);font-weight:500}
.hbtn:hover{background:var(--surface-2)}
.hbtn[aria-pressed="true"]{background:var(--surface);border-color:var(--line)}
.hbtn.icon{width:38px;padding:0;justify-content:center}

.main{position:relative;min-height:0}
.ws{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;padding:0 16px 16px}
.stagecol{display:grid;grid-template-rows:minmax(0,1fr) auto;gap:12px;min-height:0;min-width:0}
.stage{position:relative;min-height:0;border-radius:20px;overflow:hidden;touch-action:none;cursor:grab;
  background:radial-gradient(120% 90% at 50% 30%,var(--stage-1),var(--stage-2))}
.stage.dragging{cursor:grabbing}
.cubes{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;gap:var(--cgap,24px);padding:56px 16px 64px}
.cubecol{display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0}
.readout{display:flex;flex-direction:column;align-items:center;gap:2px;min-height:48px}
.readout .role{font:500 var(--t-cap)/1.2 var(--f-num);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.readout .val{font:500 var(--t-xl)/1.1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--ink)}
.app.no-readout .readout{visibility:hidden}

.hint{position:absolute;top:12px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:6px 6px 6px 12px;border-radius:var(--r-pill);background:var(--surface);border:1px solid var(--line);font-size:var(--t-sm);white-space:nowrap;z-index:3;max-width:calc(100% - 24px)}
.hint span{overflow:hidden;text-overflow:ellipsis}
.refview{position:absolute;left:12px;bottom:12px;z-index:3}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:40px;padding:0 14px;border-radius:var(--r-2);border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:500;font-size:var(--t-sm);text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.sm{min-height:32px;padding:0 10px;border-radius:var(--r-pill)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-size:var(--t-md);min-height:46px}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.no3d-msg{position:absolute;top:12px;left:12px;right:12px;padding:10px 14px;border-radius:var(--r-2);background:var(--surface);border:1px solid var(--line);font-size:var(--t-sm);z-index:2}
.app.no3d .cubebox{display:none}
.app.no3d .readout .val{font-size:var(--t-2xl)}
.app.no3d .stage{cursor:default}

/* nerd drawer */
.nerd{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 16px;max-height:34cqh;overflow:auto;min-width:0}
.nerd h3{margin:0 0 8px;font:500 var(--t-cap)/1 var(--f-num);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between}
.tablewrap{overflow-x:auto}
.nerd table{border-collapse:collapse;width:100%;font:var(--t-sm)/1.4 var(--f-num);font-variant-numeric:tabular-nums}
.nerd th,.nerd td{text-align:right;padding:3px 8px;white-space:nowrap;border-bottom:1px solid var(--line)}
.nerd th:first-child,.nerd td:first-child{text-align:left;padding-left:0}
.nerd th{font-weight:500;color:var(--ink-2)}
.nerd .extra{margin:8px 0 0;font:var(--t-sm)/1.5 var(--f-num);color:var(--ink-2);display:flex;flex-wrap:wrap;gap:4px 18px}

/* dock */
.dock{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:auto;display:flex;flex-direction:column;min-height:0;min-width:0}
.grab{display:none}
.peek{display:flex;flex-direction:column;gap:12px;padding:16px;border-bottom:1px solid var(--line)}
.peekrow{display:flex;align-items:center;gap:10px}
.peekrow .primary{flex:1}
.summary{font:500 var(--t-xl)/1 var(--f-num);font-variant-numeric:tabular-nums;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.slots{display:flex;flex-direction:column}
.slot{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.slot:last-child{border-bottom:0}
.cap{font:500 var(--t-cap)/1 var(--f-num);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between;gap:8px}
.cap .n{opacity:.7}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field legend{font-size:var(--t-sm);font-weight:500;padding:0}
.help{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.inrow{display:flex;gap:8px;min-width:0}
.inrow>input{flex:1;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=search],select{height:40px;border:1px solid var(--line);border-radius:var(--r-1);background:var(--bg);padding:0 10px;min-width:0}
input[type=text],input[type=number]{font-family:var(--f-num);font-variant-numeric:tabular-nums}
fieldset{border:0;margin:0;padding:0;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r-1);overflow:hidden;background:var(--bg)}
.seg label{flex:1;position:relative;display:flex}
.seg input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.seg span{flex:1;text-align:center;padding:9px 8px;font-size:var(--t-sm);font-weight:500;color:var(--ink-2);white-space:nowrap}
.seg input:checked+span{background:var(--surface);color:var(--ink);box-shadow:inset 0 -2px 0 var(--accent)}
.seg input:focus-visible+span{outline:2px solid var(--focus);outline-offset:-2px}
.seg label+label{border-left:1px solid var(--line)}
.chk{display:flex;align-items:center;gap:10px;font-size:var(--t-sm);min-height:32px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--accent);margin:0}
input[type=range]{width:100%;accent-color:var(--accent)}
.rangehead{display:flex;justify-content:space-between;font-size:var(--t-sm);font-weight:500}
.rangehead output{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.turngrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.turngrid .btn{padding:0;font-family:var(--f-num);min-height:40px}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow .btn{flex:1}
.mocktools{margin:12px 16px 16px;padding:12px;border:1px dashed var(--line);border-radius:var(--r-2);display:flex;flex-direction:column;gap:8px}
.mocktools .btnrow .btn{flex:1 1 40%;min-height:34px;font-size:12.5px}
.wf{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:var(--t-sm)}
.viewsec{display:none}

/* status zone */
.status{display:flex;flex-direction:column;gap:8px}
.chiprow{display:flex;align-items:center;gap:10px;min-width:0}
.chip{--c:var(--s-ready);display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 8px;border-radius:var(--r-pill);font:500 var(--t-sm)/1.2 var(--f-ui);flex:none;
  color:var(--c);background:color-mix(in srgb,var(--c) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 38%,transparent)}
.chip.moving{--c:var(--s-moving)} .chip.syncing{--c:var(--s-sync)} .chip.paused{--c:var(--s-paused)} .chip.done{--c:var(--s-done)}
.chip.moving svg{animation:spin 1.2s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.detail{font-size:var(--t-sm);color:var(--ink-2);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.warnrow,.errrow{--c:var(--s-warn);display:flex;gap:8px;align-items:flex-start;padding:8px 8px 8px 10px;border-radius:var(--r-2);font-size:var(--t-sm);line-height:1.4;
  background:color-mix(in srgb,var(--c) 11%,var(--surface));border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.errrow{--c:var(--s-error)}
.warnrow svg,.errrow svg{color:var(--c);margin-top:2px}
.warnrow b,.errrow b{color:var(--c);font-weight:600}
.warnrow .x,.errrow .x{margin-left:auto;background:none;border:0;cursor:pointer;color:var(--ink-2);width:28px;height:28px;flex:none;border-radius:var(--r-1);display:grid;place-items:center}

/* presentation */
.presbar{display:none}
.app.present{grid-template-rows:0 minmax(0,1fr)}
.app.present .hdr{visibility:hidden;padding:0;height:0;overflow:hidden}
.app.present .ws{grid-template-columns:minmax(0,1fr);padding:0;gap:0}
.app.present .dock,.app.present .nerd{display:none}
.app.present .stage{border-radius:0}
.app.present .readout .val{font-size:var(--t-2xl)}
.app.present .presbar{display:flex;position:absolute;top:12px;left:12px;right:12px;justify-content:space-between;align-items:center;gap:8px;z-index:4}
.app.present .hint{top:60px}

/* popovers */
.pop{position:absolute;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 18px 40px -18px rgba(0,0,0,.35)}
.switcher{top:58px;left:16px;width:min(460px,calc(100cqw - 32px));max-height:min(620px,calc(100cqh - 74px));display:flex;flex-direction:column}
.sw-head{display:flex;gap:8px;padding:12px;border-bottom:1px solid var(--line)}
.sw-head input{flex:1}
.sw-list{overflow:auto;padding:6px 6px 10px}
.sw-group{padding:10px 10px 4px}
.sw-item{display:flex;align-items:center;gap:12px;padding:8px 10px;border-radius:var(--r-2);text-decoration:none;color:var(--ink);min-height:48px}
.sw-item:hover,.sw-item:focus-visible{background:var(--surface-2)}
.sw-item[aria-current="page"]{background:var(--accent-soft)}
.sw-item .nm{font-weight:500;flex:1;min-width:0}
.sw-item .meta{font:var(--t-cap)/1.2 var(--f-num);color:var(--ink-2);white-space:nowrap}
.glyph{width:26px;height:26px;flex:none;display:grid;gap:2px;padding:3px;border-radius:5px;background:var(--surface-2)}
.glyph i{border-radius:2px;background:var(--ink-2);opacity:.75}
.sw-sec{display:flex;justify-content:space-between;align-items:baseline;padding:14px 10px 2px;font:600 var(--t-md)/1.2 var(--f-ui);border-top:1px solid var(--line);margin-top:6px}
.sw-sec:first-of-type{border-top:0;margin-top:0}
.sw-sec a{color:var(--ink)}
.sw-sec .meta{font:var(--t-cap)/1 var(--f-num);color:var(--ink-2)}
.sw-group{padding:8px 10px 2px 10px}
.feat{font:500 10px/1 var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--accent);border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);border-radius:var(--r-pill);padding:3px 6px}
.viewmenu{top:58px;right:16px;width:300px;padding:8px 0}
.vm{display:flex;flex-direction:column}
.vm .slot{border-bottom:1px solid var(--line)}
.vm a.btn{justify-content:space-between}
.scrim{position:absolute;inset:0;z-index:15;background:transparent}

/* pages (home, more, states, notes) */
.page{position:absolute;inset:0;overflow:auto;padding:4px 16px 40px}
.page-in{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.hero{border-radius:24px;overflow:hidden;background:radial-gradient(120% 90% at 50% 25%,var(--stage-1),var(--stage-2));display:grid;grid-template-rows:auto auto}
.hero .stagebox{position:relative;height:clamp(240px,52cqh,460px);touch-action:pan-y}
.hero .cubes{padding:24px 16px 16px}
.herocopy{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;padding:0 28px 28px}
.herocopy>div{max-width:560px;min-width:0}
.eyebrow{font:500 var(--t-cap)/1 var(--f-num);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin:0 0 10px}
h1{font:600 clamp(26px,4.2cqw,42px)/1.08 var(--f-ui);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font:600 var(--t-lg)/1.2 var(--f-ui);margin:0;text-wrap:balance}
.lede{margin:10px 0 0;color:var(--ink-2);line-height:1.5;max-width:56ch}
.sechead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sechead p{margin:0;color:var(--ink-2);font-size:var(--t-sm)}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.tiles.more{grid-template-columns:repeat(5,minmax(0,1fr))}
.tile{display:flex;flex-direction:column;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:transform var(--dur-chrome) var(--ease-chrome),box-shadow var(--dur-chrome)}
.tile:hover{transform:translateY(-2px);box-shadow:0 14px 30px -18px rgba(0,0,0,.4)}
.thumb{position:relative;height:150px;background:radial-gradient(120% 100% at 50% 20%,var(--stage-1),var(--stage-2));display:flex;align-items:center;justify-content:center;gap:4px;pointer-events:none}
.thumb .cubecol{gap:0}
.tile .tx{padding:12px 14px 14px;display:flex;flex-direction:column;gap:4px}
.tile .nm{font-weight:600}
.tile .ds{font-size:var(--t-sm);color:var(--ink-2);line-height:1.4}
.tile .mt{font:var(--t-cap)/1.3 var(--f-num);color:var(--ink-2);margin-top:4px;letter-spacing:.04em}
.tile.moretile .thumb{background:var(--surface-2)}
.morecount{position:absolute;right:12px;bottom:10px;font:500 var(--t-sm)/1 var(--f-num);color:var(--ink-2)}
.crumb{display:flex;gap:8px;align-items:center;font-size:var(--t-sm);color:var(--ink-2)}
.crumb a{color:var(--ink)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font:500 var(--t-cap)/1 var(--f-num);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
.card p{margin:0;font-size:var(--t-sm);color:var(--ink-2);line-height:1.45}
.fallback-demo{display:flex;gap:18px;justify-content:center;padding:10px;border-radius:12px;background:var(--surface-2)}
.fallback-demo .val{font:500 var(--t-xl)/1 var(--f-num)}
.doc{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px;line-height:1.55}
.doc p,.doc li{max-width:72ch}
.doc ul,.doc ol{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.doc table{border-collapse:collapse;font-size:var(--t-sm);min-width:640px}
.doc th,.doc td{border-bottom:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}
.doc th{font:500 var(--t-cap)/1.3 var(--f-num);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.doc code{font:var(--t-sm) var(--f-num);background:var(--surface-2);padding:1px 5px;border-radius:4px}
.sw{display:inline-block;width:14px;height:14px;border-radius:4px;vertical-align:-2px;margin-right:6px;border:1px solid var(--line)}

/* ---------- cubes (stand-ins) ---------- */
.cubebox{--size:180px;position:relative;width:var(--size);height:var(--size);perspective:calc(var(--size) * 7);flex:none}
.cubebox::before{content:"";position:absolute;left:8%;right:8%;bottom:-10%;height:18%;border-radius:50%;background:radial-gradient(closest-side,var(--shadow),transparent);filter:blur(3px)}
.app.low .cubebox::before{display:none}
.cube{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d;
  --cs:calc(var(--size) * .66 / var(--n));
  transform:rotateX(var(--vx,-20deg)) rotateY(var(--vy,-26deg));transition:transform var(--view-ms,0ms) var(--ease-chrome)}
.cubie,.layer{position:absolute;transform-style:preserve-3d}
.cubie{width:var(--cs);height:var(--cs);left:calc(var(--cs) / -2);top:calc(var(--cs) / -2)}
.layer{left:0;top:0;width:0;height:0}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:16%;background:var(--plastic)}
.fR{background:color-mix(in srgb,var(--plastic) 80%,#000)} .fU{background:color-mix(in srgb,var(--plastic) 88%,#fff)}
.fL{background:color-mix(in srgb,var(--plastic) 85%,#000)} .fD{background:color-mix(in srgb,var(--plastic) 70%,#000)}
.st{position:absolute;inset:7%;border-radius:14%;background:#e9e7e0;display:grid;place-items:center;overflow:hidden;
  color:#12325a;font:600 calc(var(--cs) * .6)/1 var(--f-print);background-repeat:no-repeat}
.st.k-l{font-size:calc(var(--cs) * .22);place-items:end center;padding-bottom:16%}
.st.k-c{font-size:calc(var(--cs) * .34);color:#fff}
.st.k-L{font-size:calc(var(--cs) * .5)}
.fR .st{filter:brightness(.86)} .fU .st{filter:brightness(1.04)} .fL .st{filter:brightness(.9)} .fD .st{filter:brightness(.78)}
.app.low .st{filter:none!important}

.net{display:grid;gap:3px;margin-top:6px;--cs:10px}
.netface{position:relative;display:grid;grid-template-columns:repeat(var(--n),var(--cs));background:var(--plastic);border-radius:3px;padding:1px}
.netcell{position:relative;width:var(--cs);height:var(--cs)}
.net .st{filter:none!important;border-radius:16%}
.netlbl{display:none}
.app.present .net{display:none}

/* ---------- compact desktop ---------- */
@container dev (max-width: 1180px){ .ws{grid-template-columns:minmax(0,1fr) 310px} .tiles.more{grid-template-columns:repeat(4,minmax(0,1fr))} }
@container dev (max-width: 980px){ .tiles{grid-template-columns:repeat(2,minmax(0,1fr))} .tiles.more{grid-template-columns:repeat(3,minmax(0,1fr))} .hbtn .lbl{display:none} .hbtn{padding:0 10px} }

/* ---------- phone landscape ---------- */
@container dev (max-height: 520px) and (min-width: 641px){
  .hdr{padding:6px 12px;gap:8px} .swbtn,.hbtn{height:34px} .brand b{display:none}
  .ws{grid-template-columns:minmax(0,1fr) 300px;gap:8px;padding:0 8px 8px}
  .cubes{padding:40px 8px 44px}
  .readout{min-height:36px} .readout .val{font-size:var(--t-lg)}
  .peek{padding:12px;gap:10px} .slot{padding:12px}
  .switcher,.viewmenu{top:48px}
  .hero .stagebox{height:62cqh}
}

/* ---------- phone portrait: bottom sheet ---------- */
@container dev (max-width: 640px){
  .hdr{padding:10px 12px;gap:8px}
  .brand b,.hdr .desk{display:none}
  .swbtn{flex:1;max-width:none} .swbtn .meta{display:none}
  .ws{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;padding:0;gap:0}
  .stagecol{gap:0}
  .stage{border-radius:0}
  .cubes{padding:48px 8px 52px}
  .readout .val{font-size:var(--t-lg)} .readout{min-height:38px}
  .dock{border-radius:22px 22px 0 0;border-width:1px 0 0;height:var(--sheet-h);transition:height var(--dur-view) var(--ease-chrome);overflow:hidden auto;
    padding-bottom:env(safe-area-inset-bottom,0px);overscroll-behavior:contain;box-shadow:0 -10px 30px -18px rgba(0,0,0,.35)}
  .dock[data-snap="peek"]{--sheet-h:186px} .dock[data-snap="half"]{--sheet-h:50cqh} .dock[data-snap="full"]{--sheet-h:84cqh}
  .dock.dragging{transition:none}
  .grab{display:flex;justify-content:center;align-items:center;flex:none;height:22px;border:0;background:none;cursor:ns-resize;position:sticky;top:0;z-index:2;background:var(--surface);touch-action:none}
  .grab::before{content:"";width:40px;height:5px;border-radius:3px;background:var(--line)}
  .peek{padding:4px 16px 14px;position:sticky;top:22px;background:var(--surface);z-index:1}
  .viewsec{display:flex}
  .nerd{border-radius:0;border-width:1px 0 0;max-height:none}
  .switcher{top:auto;bottom:0;left:0;right:0;width:auto;height:58cqh;max-height:none;border-radius:22px 22px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .app.sw-open .dock{--sheet-h:58cqh}
  .viewmenu{display:none}
  .page{padding:0 12px 32px}
  .tiles,.tiles.more{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .thumb{height:118px}
  .tile .ds{display:none}
  .thumb.k3 .cubecol{margin:0 -12px;transform:scale(.66)}
  .swbtn .nm{display:none} .swbtn .short{display:inline}
  .herocopy{padding:0 18px 20px}
  .hero{border-radius:18px}
  .hero .stagebox{height:36cqh}
}
@container dev (min-width: 641px){ .summary,.apps-btn{display:none} }

@media (prefers-reduced-motion: reduce){ *{transition-duration:0ms!important;animation-duration:0ms!important} }
.app.rm *{transition-duration:0ms!important;animation:none!important}

<script>
"use strict";
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,props,...kids){const e=document.createElement(tag);for(const[k,v]of Object.entries(props||{})){if(v==null||v===false)continue;if(k==="class")e.className=v;else if(k==="style")e.style.cssText=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v===true?"":v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(String(c)));}return e;}
const svgI=(d)=>{const s=document.createElementNS("http://www.w3.org/2000/svg","svg");s.setAttribute("viewBox","0 0 16 16");s.setAttribute("class","i");s.setAttribute("aria-hidden","true");s.innerHTML=d;return s;};
const ICON={
  ready:'<circle cx="8" cy="8" r="5"/>',
  moving:'<path d="M13 8a5 5 0 1 1-1.6-3.7"/><path d="M12 1.8v3h-3"/>',
  syncing:'<path d="M3 6.5a5 5 0 0 1 8.8-2M13 9.5a5 5 0 0 1-8.8 2"/><path d="M12 1.8v2.8H9.2M4 14.2v-2.8h2.8"/>',
  paused:'<path d="M6 4v8M10 4v8"/>',
  done:'<path d="M3.5 8.5l3 3 6-7"/>',
  warn:'<path d="M8 2.2l6.3 11.3H1.7z"/><path d="M8 6.8v3.2M8 12.1v.01"/>',
  error:'<circle cx="8" cy="8" r="6"/><path d="M5.9 5.9l4.2 4.2M10.1 5.9l-4.2 4.2"/>',
  x:'<path d="M4 4l8 8M12 4l-8 8"/>'
};
const pad=(v,n=2)=>String(v).padStart(n,"0");
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

/* ================= cube engine (stand-in) =================
   Real cubie model: positions and stickers move only by quarter turns of layers.
   Timing (ms) and easing are inputs from the app; the engine only interpolates. */
const DIR={F:[0,0,1],B:[0,0,-1],R:[1,0,0],L:[-1,0,0],U:[0,-1,0],D:[0,1,0]};
const vkey=v=>v.map(x=>x===0?0:x).join(",");
const DIRBY={};for(const[k,v]of Object.entries(DIR))DIRBY[vkey(v)]=k;
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
function rot(v,axis,q){const[x,y,z]=v;if(axis==="x")return[x,-q*z,q*y];if(axis==="y")return[q*z,y,-q*x];return[-q*y,q*x,z];}
const FACE_ROT={F:[],B:[["y",1],["y",1]],R:[["y",1]],L:[["y",-1]],U:[["x",1]],D:[["x",-1]]};
const FACE_T={F:"",B:"rotateY(180deg)",R:"rotateY(90deg)",L:"rotateY(-90deg)",U:"rotateX(90deg)",D:"rotateX(-90deg)"};
const applyFace=(d,v)=>FACE_ROT[d].reduce((a,[ax,q])=>rot(a,ax,q),v);
const U0={},R0={};for(const d in DIR){U0[d]=applyFace(d,[0,-1,0]);R0[d]=applyFace(d,[1,0,0]);}
function stickerRot(d,up){const k=vkey(up);if(k===vkey(U0[d]))return 0;if(k===vkey(R0[d]))return 90;if(k===vkey(U0[d].map(x=>-x)))return 180;return 270;}
const same=(a,b)=>(a?.k||"b")===(b?.k||"b")&&(a?.t||"")===(b?.t||"")&&(a?.c||"")===(b?.c||"");
const EASE="cubic-bezier(.45,0,.25,1)";

const PICS={
  night:"radial-gradient(circle at 70% 24%,#e8c46a 0 13%,transparent 13.5%),radial-gradient(130% 34% at 40% 104%,#5b8ec4 0 62%,transparent 63%),conic-gradient(from 151deg at 62% 40%,#ece6da 0 58deg,transparent 0),conic-gradient(from 150deg at 30% 33%,#82d0b4 0 60deg,transparent 0),linear-gradient(#24384f,#24384f)",
  desert:"radial-gradient(circle at 34% 30%,#c8843c 0 15%,transparent 15.5%),radial-gradient(150% 55% at 20% 112%,#8a2230 0 52%,transparent 52.5%),radial-gradient(150% 66% at 85% 104%,#b5532f 0 55%,transparent 55.5%),linear-gradient(#d8bea6,#d8bea6)",
  sunset:"radial-gradient(circle at 50% 58%,#fbe6a6 0 16%,transparent 16.5%),linear-gradient(#f2b45a 0 34%,#e07b39 0 56%,#b8334a 0 78%,#5a1f3d 0)",
  sea:"radial-gradient(34% 15% at 44% 54%,#c79a2e 0 92%,transparent 100%),conic-gradient(from 60deg at 71% 54%,#c79a2e 0 60deg,transparent 0),repeating-radial-gradient(circle at 50% 130%,#0f3442 0 7%,#164c5d 7% 13%)",
  forest:"conic-gradient(from 152deg at 28% 22%,#2f6b45 0 56deg,transparent 0),conic-gradient(from 150deg at 66% 34%,#3f8a57 0 60deg,transparent 0),conic-gradient(from 154deg at 48% 52%,#255a39 0 52deg,transparent 0),linear-gradient(#e7eedc,#e7eedc)",
  sky:"radial-gradient(circle at 26% 70%,#ffffff 0 18%,transparent 18.5%),radial-gradient(circle at 44% 66%,#ffffff 0 14%,transparent 14.5%),radial-gradient(circle at 76% 30%,#f7f0d8 0 9%,transparent 9.5%),linear-gradient(160deg,#8fb9e2,#dde9f3)"
};

class Cube{
  constructor({n=2,plastic="#222",faces}){
    this.n=n;this.m=n-1;this.moves=0;this.busy=false;this.target=null;this.getMs=()=>0;this.ease=EASE;
    this.el=h("div",{class:"cube",style:`--n:${n};--plastic:${plastic}`});
    this.layer=h("div",{class:"layer"});this.el.append(this.layer);
    this.plastic=plastic;this.cubies=[];
    for(let i=0;i<n;i++)for(let j=0;j<n;j++)for(let k=0;k<n;k++){
      const c={p:[2*i-this.m,2*j-this.m,2*k-this.m],st:{},el:h("div",{class:"cubie"}),faces:{}};
      for(const d of "FBRLUD"){const f=h("div",{class:"face f"+d,style:`transform:${FACE_T[d]} translateZ(calc(var(--cs) / 2))`});c.faces[d]=f;c.el.append(f);}
      this.cubies.push(c);this.el.append(c.el);
    }
    if(faces)this.load(faces);
  }
  load(faces){
    const m=this.m;
    for(const c of this.cubies){c.st={};
      for(const d of "FBRLUD"){
        if(dot(c.p,DIR[d])!==m)continue;
        const col=(dot(c.p,R0[d])+m)/2,row=(-dot(c.p,U0[d])+m)/2,g=faces[d];
        let s;
        if(g&&g.pic)s={k:"p",pic:g.pic,col,row};
        else s=(g&&g[row]&&g[row][col])||{k:"b",t:""};
        c.st[d]=Object.assign({},s,{up:U0[d]});
      }
      this.paint(c);
    }
    this.refreshNet();
  }
  paint(c){
    const[x,y,z]=c.p;
    c.el.style.transform=`translate3d(calc(var(--cs) * ${x/2}),calc(var(--cs) * ${y/2}),calc(var(--cs) * ${z/2}))`;
    for(const d of "FBRLUD"){
      const f=c.faces[d],s=c.st[d];f.replaceChildren();if(!s)continue;
      f.append(this.stEl(d,s));
    }
