<!doctype html>
<html lang="en">
  <head>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f3eb" />
    <title>Cubistry · Chronocube Studio</title>
  </head>
  <body class="chronocube-page">
    <main>
      <header class="floating-island">
        <a class="brand" href="chronocube.html" aria-label="Chronocube Studio home">
          <span class="brand-mark">▦</span> CUBISTRY
        </a>
        <div class="application-choice">
          <label for="studio-application">Studio / mode</label>
          <select id="studio-application">
            <optgroup label="Chronocube 2×2 Studio">
              <option value="clock" selected>Live H–M–S Clock (3 cubes)</option>
              <option value="ms-timer">M/S Timer & Stopwatch (3 cubes)</option>
              <option value="hm-clock">H–M Wall Clock (2 cubes)</option>
              <option value="tenth">1/10-Second Counter (1 cube)</option>
              <option value="counter">Counter 0–99 (1 cube)</option>
              <option value="timer">60-Minute Workshop Timer (1 cube)</option>
              <option value="five-second-timer">5-Second Precision Timer (1 cube)</option>
              <option value="hsm-counter">H/M/S Counter 00–59 (1 cube)</option>
              <option value="ms-counter">M/S Counter 00–59 (1 cube)</option>
              <option value="hm-one-cube">H/M One-Cube Counter (1 cube)</option>
            </optgroup>
            <optgroup label="Calendar & Puzzles (3×3)">
              <option value="calendar.html">Calendar · Deutsch / English</option>
              <option value="playground.html">Picture Puzzle Playground</option>
              <option value="status.html">CI Quality Cube</option>
            </optgroup>
            <optgroup label="Classic Standalone Pages">
              <option value="clock.html">Standalone Clock</option>
              <option value="ms-timer.html">Standalone M/S Timer</option>
              <option value="index.html">Classic Counter</option>
            </optgroup>
          </select>
        </div>
      </header>

      <div class="clock-heading">
        <div>
          <h1 id="studio-heading">Live H–M–S Clock</h1>
          <p class="small" id="studio-subtitle">One current time. Three physical cubes.</p>
        </div>
        <div class="studio-header-nav">
          <span class="studio-mode-pill" id="studio-cube-pill">
            <span class="badge" id="studio-cube-count-badge">3 CUBES</span>
            <span id="studio-mode-label">H · M · S</span>
          </span>
        </div>
      </div>

      <div class="clock-workspace">
        <section class="clock-stage" id="studio-stage" aria-label="Chronocube Studio Stage">
          <div id="studio-scene" class="clock-viewer"></div>
          <div id="studio-cards" class="clock-cubes" data-count="3"></div>
          <aside id="studio-controls" class="clock-control floating-hud" aria-label="Studio controls">
            <!-- Dynamically populated per active mode -->
          </aside>
        </section>
      </div>

      <button
        type="button"
        id="exit-presentation-btn"
        class="presentation-exit-btn"
        aria-label="Exit presentation mode"
      >
        ✕ Exit Presentation
      </button>

      <p id="studio-error" class="error" role="alert"></p>

      <p class="small sr-only" id="studio-footer-note">
        Chronocube Studio integrates physically realizable 2×2 twisty puzzle counters, timers, and clocks.
        Drag the shared 3D view to inspect all cubes simultaneously.
      </p>
    </main>
    <script type="module" src="/src/chronocube.mjs"></script>
  </body>
</html>
