<html lang="en">

  <meta charset="utf-8" /><meta

    content="width=device-width,initial-scale=1"
  /><title>Library-only 2×2 consumer</title
  ><link rel="stylesheet" href="/examples/example.css" />
  <body>
    <main>
      <h1>Library-only consumer</h1>
      <p>
        This example imports only shared core, mechanics, assets and viewer
        packages. It has its own color/image/text design and no counter, timer,
        target catalog or solver dependency.
      </p>
      <button id="turn" disabled>R</button
      ><button id="inverse" disabled>R′</button>
      <p id="status" role="status">Loading independent design…</p>
      <div id="cube" aria-label="Independent physical cube"></div>
      <p>
        <a href="/solver-acceptance.html">Live solver acceptance</a> ·
        <a href="/">Counter MVP</a>
      </p>
    </main>
    <script type="module" src="/examples/library-only/main.ts"></script>
  </body>
