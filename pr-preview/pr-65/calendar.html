<!doctype html>
<html lang="en">
  <head><meta name="robots" content="noindex,nofollow">
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f5f3eb" />
    <title>Cubistry · Calendar cubes</title>
    <script type="module" crossorigin src="/cubistry/pr-preview/pr-65/assets/calendar-DgbiT5js.js"></script>
    <link rel="modulepreload" crossorigin href="/cubistry/pr-preview/pr-65/assets/index-D2cyHb7_.js">
    <link rel="modulepreload" crossorigin href="/cubistry/pr-preview/pr-65/assets/three-CrrH7LdZ.js">
    <link rel="stylesheet" crossorigin href="/cubistry/pr-preview/pr-65/assets/calendar-BpSdhA_h.css">
    <link rel="stylesheet" crossorigin href="/cubistry/pr-preview/pr-65/assets/style-Gvnaknp7.css">
  </head>
  <body><aside style="padding:12px;background:#fff0b3;color:#222">PR #65 — non-production preview · 3f1bdc746e7f</aside>
    <main>
      <header>
        <a class="brand" href="./"
          ><span class="brand-mark">▦</span> CUBISTRY</a
        >
        <div class="application-choice">
          <label for="calendar-application">Cube / application</label
          ><select id="calendar-application">
            <option value="index.html">Counter 0–99</option>
            <option value="index.html?application=hsm-counter">
              H/S/M Counter 00–59
            </option>
            <option value="clock.html">Live H–M–S Clock</option>
            <option value="calendar.html" selected>
              Calendar · Deutsch / English
            </option>
          </select>
        </div>
      </header>
      <h1>Calendar cubes</h1>
      <p class="small">
        Two independently verified prints. One date at a time.
      </p>
      <div class="calendar-workspace">
        <section class="calendar-stage" aria-label="Physical calendar cube">
          <div id="calendar-viewer" aria-busy="true"></div>
          <div
            id="calendar-front"
            class="sr-only"
            aria-label="Committed calendar face"
          ></div>
          <p id="calendar-state" role="status">Preparing the fixed print…</p>
        </section>
        <aside class="calendar-controls">
          <h2>Date</h2>
          <output id="calendar-digital" aria-label="Requested calendar date"
            >—</output
          >
          <p id="calendar-zone" class="small"></p>
          <label for="calendar-design">Physical print</label
          ><select id="calendar-design" disabled>
            <option value="de-a">Deutsch · A</option>
            <option value="en-3">English · 3</option>
          </select>
          <p id="calendar-layout" class="small"></p>
          <label id="calendar-padding-label" hidden
            ><input id="calendar-padding" type="checkbox" checked /> Leading
            zero</label
          >
          <label for="calendar-date">Inspect a date</label
          ><input
            type="date"
            id="calendar-date"
            min="0001-01-01"
            max="9999-12-31"
            disabled
          /><button id="calendar-set" disabled>Show date</button
          ><button id="calendar-live" class="primary" disabled>
            Live · today
          </button>
          <label for="calendar-speed">Rotation Speed</label
          ><select id="calendar-speed">
            <option value="500">500 ms</option>
            <option value="250">250 ms</option>
            <option value="100" selected>100 ms</option>
            <option value="50">50 ms</option>
            <option value="10">10 ms</option>
          </select>
          <p class="small">
            Drag to look around. Date changes follow legal turns, including
            whole-cube rotations. The fixed stickers never change.
          </p>
        </aside>
      </div>
      <p id="calendar-error" class="error" role="alert"></p>
    </main>
  </body>
</html>
