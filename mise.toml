# Single source of truth for research toolchains (host and .devcontainer).
[tools]
java = "temurin-21"   # Flix needs Java 21+
julia = "1.13"        # research/ci-quality-cube/Project.toml: julia = "1.13"
node = "22"           # package.json engines: node >= 22
python = "3.12"       # requirements-verifier.txt (sympy)

# Search and structured data (gh:wstein/bundledock)
fd = "10.5"
jq = "1.8"
ripgrep = "15.2"
yq = "4.54"

# Navigation, filtering, and viewing (gh:wstein/bundledock)
bat = "0.26"
bottom = "0.14"
dust = "1.2"
fzf = "0.74"
lazygit = "0.66"
lsd = "1.2"
xh = "0.26"
zoxide = "0.10"

# Developer utilities, linting, and benchmarking (gh:wstein/bundledock)
actionlint = "1.7"
git-cliff = "2.14"
gitleaks = "8.30"
hadolint = "2.15"
hyperfine = "2.0"
just = "1.59"
lychee = "0.24"
ruff = "0.17"
shellcheck = "0.11"
shfmt = "3.14"
typos = "1.51"
uv = "0.13"
watchexec = "2.8"

[env]
JULIA_NUM_THREADS = "auto"
_.python.venv = { path = ".venv", create = true }
