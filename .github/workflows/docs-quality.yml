name: Documentation quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to a pull request supersedes its running checks. A running
# main run is not cancelled, but a newer main run displaces a main run that
# is still pending in the same group.
concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spelling:
    name: US English spelling
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check spelling
        uses: crate-ci/typos@v1.52.0
        with:
          config: typos.toml

  links:
    name: Markdown links (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check local links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --offline --root-dir . --no-progress
            --exclude-file .lycheeignore
            './**/*.md'
          fail: true

  external-links:
    name: Markdown links (external, advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check remote links
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress --max-retries 2 --timeout 15
            --exclude-file .lycheeignore
            './**/*.md'
          fail: false
