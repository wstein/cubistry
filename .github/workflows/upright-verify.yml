# SPDX-License-Identifier: AGPL-3.0-or-later
name: Upright verify

# Tests for the strict upright rule of research/calendar-7x7 (upright-flix): the Flix and
# Julia replays of the 91 move words, their negative controls, the rule self-tests, and a
# regression check that the legacy rule still reproduces the committed 2027 chain receipts
# and the matchability receipt. It also checks the strict chain verifiers (pure_chain.jl and
# the Flix chain command with the strict rule, the independent replay verify_chain.jl) on the
# committed 4-edge smoke chain with negative controls, and runs a 4-edge production smoke (2 segments of 2 edges, the second
# resumed) through upright-chain-segment.yml. It does NOT start the 863-edge chain (upright-chain.yml
# does). Julia and Flix only, no Python. The research code is checked out from research_ref.
#
# The pull_request trigger below (limited to this file) runs the jobs for a PR that changes it,
# using the default research ref. The chain jobs are skipped when that ref does not yet contain
# the strict chain files (has_chain, has_producer).

on:
  workflow_dispatch:
    inputs:
      research_ref:
        description: Branch or tag of this repository that holds the research code
        type: string
        default: research/cube-display-feasibility
  pull_request:
    paths:
      - .github/workflows/upright-verify.yml
      - .github/workflows/upright-chain-segment.yml

permissions:
  contents: read

env:
  CAL: research/calendar-7x7
  RESEARCH_REF: ${{ inputs.research_ref || 'research/cube-display-feasibility' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      has_chain: ${{ steps.resolve.outputs.has_chain }}
      has_producer: ${{ steps.resolve.outputs.has_producer }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true # prepare only fetches this repository; no untrusted code runs here
      - name: Resolve research ref
        id: resolve
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          REF=$RESEARCH_REF
          [[ "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] || fail "research_ref has unsupported characters"
          case "$REF" in *..*|*//*|*.lock) fail "research_ref is not a plain ref name";; esac
          git fetch --no-tags --depth=1 origin "+refs/heads/$REF:refs/remotes/research/ref" 2>/dev/null \
            || git fetch --no-tags --depth=1 origin "+refs/tags/$REF:refs/remotes/research/ref" 2>/dev/null \
            || fail "research_ref '$REF' is not a branch or tag of $GITHUB_REPOSITORY"
          sha=$(git rev-parse --verify "refs/remotes/research/ref^{commit}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          for f in upright-flix/controls.sh upright-flix/rule_replay.jl upright-flix/flix/build.sh upright-moves/verify_moves.jl upright-moves/evidence/moves-strict.tsv; do
            git cat-file -e "$sha:$CAL/$f" 2>/dev/null || fail "$CAL/$f is missing at $sha"
          done
          # Optional parts: the strict chain verifiers and the production smoke.
          has_chain=true; has_producer=true
          for f in upright-beam/chain_controls.sh upright-beam/verify_chain.jl upright-beam/make_chain.jl upright-beam/evidence/chain-smoke.moves.tsv upright-beam/evidence/chain-smoke-edges.tsv; do
            git cat-file -e "$sha:$CAL/$f" 2>/dev/null || has_chain=false
          done
          git cat-file -e "$sha:$CAL/upright-beam/chain_segment.jl" 2>/dev/null || has_producer=false
          [ "$has_chain" = true ] || has_producer=false
          echo "has_chain=$has_chain" >> "$GITHUB_OUTPUT"; echo "has_producer=$has_producer" >> "$GITHUB_OUTPUT"
          {
            echo "### Upright verify"
            echo "- strict chain verifiers present: \`$has_chain\`, producer present: \`$has_producer\`"
            echo "- research_ref: \`$REF\`"
            echo "- resolved SHA: \`$sha\`"
          } >> "$GITHUB_STEP_SUMMARY"

  julia:
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13.3"
      - name: Rule self-test (legacy and strict)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"; cd "$CAL/upright-flix"
          julia --version
          for r in legacy strict; do
            CUBISTRY_RULE=$r julia --startup-file=no rule_selftest.jl | tee -a "$RUNNER_TEMP/out/julia-rule-selftest.tsv"
          done
          test "$(grep -c '^rule-selftest-verdict.*PASS' "$RUNNER_TEMP/out/julia-rule-selftest.tsv")" = 2
      - name: Independent replay verify_moves.jl (91 words, strict rule)
        run: |
          set -euo pipefail
          cd "$CAL/upright-moves"
          julia --startup-file=no verify_moves.jl ../upright-feasibility/evidence/print-strict-upright.tsv evidence/moves-strict.tsv | tee "$RUNNER_TEMP/out/julia-verify-moves.tsv" | tail -n 3
          grep -q '^move-verdict.ACCEPT_ALL_91' "$RUNNER_TEMP/out/julia-verify-moves.tsv"
      - name: Negative controls for verify_moves.jl
        run: |
          set -euo pipefail
          cd "$CAL/upright-flix"
          bash controls.sh "$RUNNER_TEMP/out/julia-controls-verify-moves.tsv" julia --startup-file=no ../upright-moves/verify_moves.jl
      - name: Research-checker replay rule_replay.jl, strict rule, with negative controls
        run: |
          set -euo pipefail
          cd "$CAL/upright-flix"
          bash controls.sh "$RUNNER_TEMP/out/julia-controls-rule-replay-strict.tsv" env CUBISTRY_RULE=strict julia --startup-file=no rule_replay.jl
      - name: Alias controls with the legacy rule (O as 0 and I as 1 must be accepted)
        run: |
          set -euo pipefail
          cd "$CAL/upright-flix"
          CONTROLS_RULE=legacy bash controls.sh "$RUNNER_TEMP/out/julia-controls-rule-replay-legacy.tsv" env CUBISTRY_RULE=legacy julia --startup-file=no rule_replay.jl
      - name: Legacy rule on the strict print (reported, not a gate)
        run: |
          cd "$CAL/upright-flix"
          CUBISTRY_RULE=legacy julia --startup-file=no rule_replay.jl ../upright-feasibility/evidence/print-strict-upright.tsv ../upright-moves/evidence/moves-strict.tsv > "$RUNNER_TEMP/out/julia-rule-replay-legacy.tsv" 2>&1 || true
          grep '^move-verdict' "$RUNNER_TEMP/out/julia-rule-replay-legacy.tsv" || tail -n 3 "$RUNNER_TEMP/out/julia-rule-replay-legacy.tsv"
      - name: check_pure.jl matchability with the strict rule on the strict print
        run: |
          set -euo pipefail
          cd "$CAL/pure-split-states"
          CUBISTRY_RULE=strict julia --startup-file=no check_pure.jl matchability ../upright-feasibility/evidence/print-strict-upright.tsv | tee "$RUNNER_TEMP/out/julia-matchability-strict.tsv"
          grep -qx $'pure-matchability\t0' "$RUNNER_TEMP/out/julia-matchability-strict.tsv"
      - name: Legacy regression (default rule) against committed receipts
        run: |
          set -euo pipefail
          cd "$CAL/pure-split-states"
          julia --startup-file=no check_pure.jl matchability evidence/print-pure-A.tsv | grep '^pure-' > "$RUNNER_TEMP/out/julia-matchability-legacy.tsv"
          cmp "$RUNNER_TEMP/out/julia-matchability-legacy.tsv" evidence/receipts/matchability.julia.tsv
          gzip -dc evidence/dag-all.tsv.gz > "$RUNNER_TEMP/dag-all.tsv"
          julia --startup-file=no pure_chain.jl evidence/print-pure-A.tsv "$RUNNER_TEMP/dag-all.tsv" evidence/chain-2027.moves.tsv > "$RUNNER_TEMP/chain-2027.julia.stdout"
          grep -E '^(source|edge|metrics|endpoint|status)' "$RUNNER_TEMP/chain-2027.julia.stdout" > "$RUNNER_TEMP/out/julia-chain-2027-legacy.tsv"
          cmp "$RUNNER_TEMP/out/julia-chain-2027-legacy.tsv" evidence/receipts/chain-2027.julia.tsv
          tail -n 1 "$RUNNER_TEMP/out/julia-chain-2027-legacy.tsv"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: upright-julia-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 30

  flix:
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the Flix replay jar
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          # flixw downloads flix.jar from a GitHub release; retry a transient 5xx there.
          jar=""
          for attempt in 1 2 3 4 5 6; do
            if built=$(bash "$CAL/upright-flix/flix/build.sh" 2>&1); then jar=$(printf "%s\n" "$built" | tail -n 1); break; fi
            printf "%s\n" "$built" | tail -n 30
            # Retry only a failed download (flixw FLIXW005 or an HTTP 5xx), never a compile error.
            printf "%s\n" "$built" | grep -qE 'FLIXW005|HTTP 5[0-9][0-9]' || { echo "::error::Flix build failed (not a download error)"; exit 1; }
            [ "$attempt" -lt 6 ] || { echo "::error::Flix download failed six times"; exit 1; }
            echo "::warning::Flix download attempt $attempt failed; retrying"; sleep $((attempt * 60))
          done
          test -n "$jar" && test -f "$jar"
          echo "FLIX_JAR=$jar" >> "$GITHUB_ENV"
          sha256sum "$jar" | tee "$RUNNER_TEMP/out/flix-replay-jar.sha256"
      - name: Rule self-test (legacy and strict)
        run: |
          set -euo pipefail
          java -Dstdout.encoding=UTF-8 -Xmx4g -jar "$FLIX_JAR" selftest | tee "$RUNNER_TEMP/out/flix-rule-selftest.tsv"
          grep -q '^rule-selftest-verdict.PASS' "$RUNNER_TEMP/out/flix-rule-selftest.tsv"
      - name: Replay the 91 words, strict rule
        run: |
          set -euo pipefail
          java -Dstdout.encoding=UTF-8 -Xmx4g -jar "$FLIX_JAR" replay strict "$CAL/upright-feasibility/evidence/print-strict-upright.tsv" "$CAL/upright-moves/evidence/moves-strict.tsv" | tee "$RUNNER_TEMP/out/flix-replay-strict.tsv" | tail -n 3
          grep -q '^move-verdict.strict.ACCEPT_ALL_91' "$RUNNER_TEMP/out/flix-replay-strict.tsv"
      - name: Negative controls for the Flix replay
        run: |
          set -euo pipefail
          bash "$CAL/upright-flix/controls.sh" "$RUNNER_TEMP/out/flix-controls-replay-strict.tsv" java -Dstdout.encoding=UTF-8 -Xmx4g -jar "$FLIX_JAR" replay strict
      - name: Alias controls with the legacy rule (O as 0 and I as 1 must be accepted)
        run: |
          set -euo pipefail
          CONTROLS_RULE=legacy bash "$CAL/upright-flix/controls.sh" "$RUNNER_TEMP/out/flix-controls-replay-legacy.tsv" java -Dstdout.encoding=UTF-8 -Xmx4g -jar "$FLIX_JAR" replay legacy
      - name: Legacy rule on the strict print (reported, not a gate)
        run: |
          java -Dstdout.encoding=UTF-8 -Xmx4g -jar "$FLIX_JAR" replay legacy "$CAL/upright-feasibility/evidence/print-strict-upright.tsv" "$CAL/upright-moves/evidence/moves-strict.tsv" > "$RUNNER_TEMP/out/flix-replay-legacy.tsv" 2>&1 || true
          grep '^move-verdict' "$RUNNER_TEMP/out/flix-replay-legacy.tsv" || tail -n 3 "$RUNNER_TEMP/out/flix-replay-legacy.tsv"
      - name: Compile the verification project (Oriented.flix port)
        run: |
          set -euo pipefail
          cd "$CAL/verification/flix"
          unset FLIX_JAR # flixw would otherwise treat the replay jar as an override
          export FLIX_CACHE_HOME=${FLIX_CACHE_HOME:-/tmp/cubistry-flix-cache} COURSIER_CACHE=${COURSIER_CACHE:-/tmp/cubistry-flix-coursier}
          ./flixw build-jar > "$RUNNER_TEMP/out/flix-verification-build.log" 2>&1 || { tail -n 40 "$RUNNER_TEMP/out/flix-verification-build.log"; exit 1; }
          tail -n 3 "$RUNNER_TEMP/out/flix-verification-build.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: upright-flix-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 30

  flix-legacy:
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the pure-split Flix jar (uses the rule-parametrized Core.flix)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          # flixw downloads flix.jar from a GitHub release; retry a transient 5xx there.
          jar=""
          for attempt in 1 2 3 4 5 6; do
            if built=$(bash "$CAL/pure-split-states/flix/build.sh" 2>&1); then jar=$(printf "%s\n" "$built" | tail -n 1); break; fi
            printf "%s\n" "$built" | tail -n 30
            # Retry only a failed download (flixw FLIXW005 or an HTTP 5xx), never a compile error.
            printf "%s\n" "$built" | grep -qE 'FLIXW005|HTTP 5[0-9][0-9]' || { echo "::error::Flix build failed (not a download error)"; exit 1; }
            [ "$attempt" -lt 6 ] || { echo "::error::Flix download failed six times"; exit 1; }
            echo "::warning::Flix download attempt $attempt failed; retrying"; sleep $((attempt * 60))
          done
          test -n "$jar" && test -f "$jar"
          echo "FLIX_JAR=$jar" >> "$GITHUB_ENV"
          sha256sum "$jar" | tee "$RUNNER_TEMP/out/flix-pure-jar.sha256"
      - name: Legacy regression (Flix chain verifier) against committed receipts
        run: |
          set -euo pipefail
          cd "$CAL/pure-split-states"
          java -Dstdout.encoding=UTF-8 -Xmx6g -jar "$FLIX_JAR" matchability evidence/print-pure-A.tsv ../english/evidence | grep '^pure-' > "$RUNNER_TEMP/out/flix-matchability-legacy.tsv"
          cmp "$RUNNER_TEMP/out/flix-matchability-legacy.tsv" evidence/receipts/matchability.flix.tsv
          gzip -dc evidence/dag-all.tsv.gz > "$RUNNER_TEMP/dag-all.tsv"
          java -Dstdout.encoding=UTF-8 -Xmx6g -jar "$FLIX_JAR" chain evidence/print-pure-A.tsv "$RUNNER_TEMP/dag-all.tsv" evidence/chain-2027.moves.tsv ../english/evidence ../en-physical-review > "$RUNNER_TEMP/chain-2027.flix.stdout"
          grep -E '^(source|edge|metrics|endpoint|status)' "$RUNNER_TEMP/chain-2027.flix.stdout" > "$RUNNER_TEMP/out/flix-chain-2027-legacy.tsv"
          cmp "$RUNNER_TEMP/out/flix-chain-2027-legacy.tsv" evidence/receipts/chain-2027.flix.tsv
          tail -n 1 "$RUNNER_TEMP/out/flix-chain-2027-legacy.tsv"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: upright-flix-legacy-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 30

  # ---- strict chain verifiers on the committed 4-edge smoke chain (2028-01 .. 2028-05) ----
  strict-chain-julia:
    needs: [prepare]
    if: needs.prepare.outputs.has_chain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13.3"
      - name: Regenerate the smoke chain from its edge words and compare with the committed chain
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"; cd "$CAL/upright-beam"
          gzip -dc ../pure-split-states/evidence/dag-all.tsv.gz > "$RUNNER_TEMP/dag-all.tsv"
          julia --startup-file=no make_chain.jl "$RUNNER_TEMP/dag-all.tsv" ../upright-feasibility/evidence/print-strict-upright.tsv ../upright-moves/evidence/moves-strict.tsv 25 evidence/chain-smoke-edges.tsv "$RUNNER_TEMP/out/chain-smoke.regenerated.moves.tsv" | tee "$RUNNER_TEMP/out/make-chain.tsv"
          cmp "$RUNNER_TEMP/out/chain-smoke.regenerated.moves.tsv" evidence/chain-smoke.moves.tsv
      - name: pure_chain.jl, strict rule, on the smoke chain
        run: |
          set -euo pipefail
          cd "$CAL/upright-beam"; export DAG=$RUNNER_TEMP/dag-all.tsv
          ./chain_runner_julia.sh ../upright-feasibility/evidence/print-strict-upright.tsv evidence/chain-smoke.moves.tsv ../upright-moves/evidence/moves-strict.tsv > "$RUNNER_TEMP/out/chain-smoke.julia.stdout"
          grep -E '^(source|edge|metrics|endpoint|status)' "$RUNNER_TEMP/out/chain-smoke.julia.stdout" > "$RUNNER_TEMP/out/receipt.julia.tsv"
          tail -n 1 "$RUNNER_TEMP/out/receipt.julia.tsv"
          grep -qx $'status\tVALID_CONTINUOUS_CHAIN\t4\t218\t294\t49' "$RUNNER_TEMP/out/receipt.julia.tsv"
      - name: Independent replay verify_chain.jl on the smoke chain
        run: |
          set -euo pipefail
          cd "$CAL/upright-beam"
          ./chain_runner_replay.sh ../upright-feasibility/evidence/print-strict-upright.tsv evidence/chain-smoke.moves.tsv ../upright-moves/evidence/moves-strict.tsv | tee "$RUNNER_TEMP/out/receipt.replay.tsv" | tail -n 2
          grep -qx $'chain-verdict\tACCEPT_CHAIN\t4\t2028-5' "$RUNNER_TEMP/out/receipt.replay.tsv"
      - name: Negative controls, pure_chain.jl
        run: |
          set -euo pipefail
          cd "$CAL/upright-beam"; export DAG=$RUNNER_TEMP/dag-all.tsv
          bash chain_controls.sh "$RUNNER_TEMP/out/controls-julia.tsv" ./chain_runner_julia.sh evidence/chain-smoke.moves.tsv
      - name: Negative controls, verify_chain.jl
        run: |
          set -euo pipefail
          cd "$CAL/upright-beam"
          bash chain_controls.sh "$RUNNER_TEMP/out/controls-replay.tsv" ./chain_runner_replay.sh evidence/chain-smoke.moves.tsv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: upright-strict-chain-julia-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 30

  strict-chain-flix:
    needs: [prepare]
    if: needs.prepare.outputs.has_chain == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Build the pure-split Flix jar (strict chain command)
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/out"
          # flixw downloads flix.jar from a GitHub release; retry a transient 5xx there.
          jar=""
          for attempt in 1 2 3 4 5 6; do
            if built=$(bash "$CAL/pure-split-states/flix/build.sh" 2>&1); then jar=$(printf "%s\n" "$built" | tail -n 1); break; fi
            printf "%s\n" "$built" | tail -n 30
            # Retry only a failed download (flixw FLIXW005 or an HTTP 5xx), never a compile error.
            printf "%s\n" "$built" | grep -qE 'FLIXW005|HTTP 5[0-9][0-9]' || { echo "::error::Flix build failed (not a download error)"; exit 1; }
            [ "$attempt" -lt 6 ] || { echo "::error::Flix download failed six times"; exit 1; }
            echo "::warning::Flix download attempt $attempt failed; retrying"; sleep $((attempt * 60))
          done
          test -n "$jar" && test -f "$jar"
          echo "FLIX_JAR=$jar" >> "$GITHUB_ENV"
          sha256sum "$jar" | tee "$RUNNER_TEMP/out/flix-pure-jar.sha256"
      - name: Flix chain command, strict rule, on the smoke chain
        run: |
          set -euo pipefail
          cd "$CAL/upright-beam"
          ./chain_runner_flix.sh ../upright-feasibility/evidence/print-strict-upright.tsv evidence/chain-smoke.moves.tsv ../upright-moves/evidence/moves-strict.tsv > "$RUNNER_TEMP/out/chain-smoke.flix.stdout"
          grep -E '^(source|edge|metrics|endpoint|status)' "$RUNNER_TEMP/out/chain-smoke.flix.stdout" > "$RUNNER_TEMP/out/receipt.flix.tsv"
          tail -n 1 "$RUNNER_TEMP/out/receipt.flix.tsv"
          grep -qx $'status\tVALID_CONTINUOUS_CHAIN\t4\t218\t294\t49' "$RUNNER_TEMP/out/receipt.flix.tsv"
      - name: Negative controls, Flix chain command
        run: |
          set -euo pipefail
          cd "$CAL/upright-beam"
          bash chain_controls.sh "$RUNNER_TEMP/out/controls-flix.tsv" ./chain_runner_flix.sh evidence/chain-smoke.moves.tsv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: upright-strict-chain-flix-${{ github.run_id }}
          path: ${{ runner.temp }}/out/
          retention-days: 30

  strict-chain-compare:
    needs: [strict-chain-julia, strict-chain-flix]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: upright-strict-chain-*-${{ github.run_id }}
          path: art
      - name: Julia and Flix receipts must be byte-identical
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cmp "art/upright-strict-chain-julia-$RUN_ID/receipt.julia.tsv" "art/upright-strict-chain-flix-$RUN_ID/receipt.flix.tsv"
          tail -n 1 "art/upright-strict-chain-flix-$RUN_ID/receipt.flix.tsv"

  # ---- 4-edge production smoke through the reusable segment workflow: two segments of 2 edges,
  # the second one resumes from the verified cumulative chain of the first ----
  chain-segment-smoke:
    needs: [prepare]
    if: needs.prepare.outputs.has_producer == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/upright-chain-segment.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      seg: "1"
      edges: "2"
      start: "2028-01"
      smoke: true

  chain-segment-smoke-2:
    needs: [prepare, chain-segment-smoke]
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/upright-chain-segment.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      seg: "2"
      edges: "2"
      start: "2028-01"
      smoke: true
      prev_artifact: upc-chain-${{ github.run_id }}-s1

  chain-segment-smoke-compare:
    needs: [prepare, chain-segment-smoke-2]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: upc-chain-${{ github.run_id }}-s2
          path: art
      - name: Produced smoke chain against the committed one (reported, not a gate)
        run: |
          # The segment was already accepted by three checkers. Equality only shows that the
          # beam is deterministic across machines and thread counts; a difference is not an error.
          if cmp "art/moves.tsv" "$CAL/upright-beam/evidence/chain-smoke.moves.tsv"; then
            echo "smoke-compare IDENTICAL to the committed chain-smoke.moves.tsv (two segments of 2 edges, the second resumed)" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "smoke-compare DIFFERENT from the committed chain-smoke.moves.tsv (two segments of 2 edges, the second resumed)" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          cat art/edges.tsv
