# SPDX-License-Identifier: AGPL-3.0-or-later
name: Window chain

# Manually dispatched producer and verifier for the month-name window chain of
# research/calendar-7x7/row1-window-chain: optimized (global macro beam) edges, one retained physical state.
# Run contract = the contract of the chain checkers: a month list S (months_path, pinned by months_sha256), a root month
# (root_month: the month the identity pose of the print shows, default the first member of S; any month 1900-01 .. 2100-01) and
# the print (print_path, print_sha256). The chain is the root month, then S; a gap in S is one bridge edge. Months that are not
# chain months get a status record (months.tsv) instead of an edge. Stages (2026-01..2050-01 on the print with root 1980-01,
# and the later ranges) are separate runs with their own list, root and print; none of them is a default here.
# It cannot be dispatched until this file is on the default branch (main); the research code is taken from
# research_ref (a commit SHA on the research branch), so the file on main does not need the research files.
#
# Jobs: prepare (validate inputs and the research commit), produce (window_chain.jl, 4 threads, job limit 70 min, no new edge
# after 3000 s of the edge loop: one segment of about an hour; stops cleanly and emits a resumable artifact), verify
# (run_checks.sh: Julia check.jl, Flix chain checker, independent verify_chain.jl; Julia and Flix receipts must be
# byte-identical; uploads the verified artifact). Segments run one after another: a stopped run is continued with prior_run_id,
# and segments.tsv records research_ref, library, width and lambda of every segment.
# Optional layout_path + layout_sha256: the producer (window_chain.jl) and the verify job (run_checks.sh) get that layout through
# CAL7_WINDOW_LAYOUT and CAL7_WINDOW_LAYOUT_SHA256. prepare refuses the run when window_chain.jl or run_checks.sh at research_ref
# does not mention the word CAL7_WINDOW_LAYOUT (fail closed; a comment with the name is enough, the check is a gate, not a proof). Without the inputs nothing is exported and nothing changes.
# direction=backward (join_end=identity, empty root_month): the producer searches from the identity pose to earlier months (window_chain.jl direction=backward); verify cuts the month list at chain_start and checks with CAL7_JOIN_END. VERIFIED.txt records direction and join_end; a continuation must match both (an older artifact counts as forward, no join_end). Default forward changes nothing.
# No commits, no gitlinks, no PR comments; the output is an artifact only.
# Stages: max_edges bounds the edges of one run (a stage of the first chain: 41 edges); start and end only bound the months of months.tsv.
# A stage after the first continues the verified artifact of the previous run (prior_run_id); expect_prior_edges (required with prior_run_id) names the edge count that
# artifact must have (stage 2: 41), so a wrong run id fails in produce before an edge is computed.
# Continuing on a longer month list or another best-effort file: prior_months_sha256 and prior_best_effort_sha256 (optional, need prior_run_id)
# name the month list and best-effort file the prior chain was produced with; they replace months_sha256 and the hash of best_effort_path in the
# comparison with the prior VERIFIED.txt (empty means the value of this run, as before). A set prior_months_sha256 that differs from
# months_sha256 also lifts the complete=false requirement (the prior chain is complete for its shorter list). All other VERIFIED.txt fields
# (print, root month, layout, 29 rule) must still match, and expect_prior_edges still applies. The pins only select which prior artifact is
# accepted; the producer still replays the chain and requires the prior months to be the first months of the new list, and the verify job
# checks the whole chain against the month list of this run. Limit: the verify job does not read the best-effort file (only its hash goes into
# VERIFIED.txt); the producer takes earlier best-effort edges from the prior unchecked, and the checkers verify the 29 rule only from the rows of
# chain.v2. With prior_best_effort_sha256 nothing checks the old edges against the new file (UNKNOWN), although the new VERIFIED.txt names the new
# hash for the whole chain. scripts/ci/window-chain-prior.test.sh probes the input checks.
# best_effort_29 (default true) turns the 29 rule of the best-effort edge on in all three checkers (CAL7_BEST_EFFORT_29=1; the Flix checker gets
# the last argument 29 from run_checks.sh); prepare refuses a research_ref whose checkers do not read it. When state_report.sh exists at
# research_ref the verify job adds its report as a second artifact (wc-state-report-<run id>), which is never a prior.
# Concurrency: one run at a time. GitHub keeps at most one running and one pending run per group; a newer dispatch replaces an
# older pending one (the replaced run is cancelled) even with cancel-in-progress false. Dispatch the next run only after the
# previous one finished.

on:
  workflow_dispatch:
    inputs:
      research_ref:
        description: Commit SHA (40 hex digits) of this repository that holds the research code and the print
        type: string
        required: true
      months_path:
        description: Repository path of the month list S at research_ref (one YYYY-MM per row, 1900-01 .. 2100-01, strictly increasing)
        type: string
        required: true
      months_sha256:
        description: SHA-256 of the month list (64 hex digits)
        type: string
        required: true
      root_month:
        description: Month the identity pose of the print shows (YYYY-MM, 1900-01 .. 2100-01); empty means the first month of the list
        type: string
        default: ""
      print_path:
        description: Repository path of the print TSV at research_ref
        type: string
        required: true
      print_sha256:
        description: SHA-256 of the print (64 hex digits)
        type: string
        required: true
      layout_path:
        description: Optional repository path of a window-local layout TSV at research_ref; empty keeps row1-revision/layout.tsv. The producer and the verify job both get it (CAL7_WINDOW_LAYOUT); the run stops in prepare when the producer or run_checks.sh at research_ref does not mention that name
        type: string
        default: ""
      layout_sha256:
        description: SHA-256 of that layout (64 hex digits); required with layout_path
        type: string
        default: ""
      best_effort_path:
        description: Optional repository path of the declared best-effort months TSV at research_ref; the producer writes the best-effort edge into such a month (wrong cell 7,1 showing 29)
        type: string
        default: ""
      claims_path:
        description: Optional repository path of a month claims TSV at research_ref (see the row1-window-chain README)
        type: string
        default: ""
      start:
        description: Optional first month of months.tsv (YYYY-MM); empty means the first chain month
        type: string
        default: ""
      end:
        description: Optional last month of months.tsv (YYYY-MM); empty means the last chain month
        type: string
        default: ""
      max_edges:
        description: Optional maximum number of new edges of this run (a stage); empty means as many as the deadline allows. The smoke run uses 3
        type: string
        default: ""
      library:
        description: Beam macro library (L1, L4, L5)
        type: string
        default: L5
      width:
        description: Beam width (1-200)
        type: string
        default: "40"
      lambda:
        description: Beam lambda (1-10)
        type: string
        default: "3"
      prior_run_id:
        description: Run id of an earlier run of this workflow whose verified chain artifact is continued
        type: string
        default: ""
      expect_prior_edges:
        description: Number of edges the prior chain must have; required with prior_run_id (not with smoke_mode); a different count stops the run before any edge is computed
        type: string
        default: ""
      prior_months_sha256:
        description: Optional SHA-256 of the month list of the prior chain, when it differs from months_sha256 (the new list continues it); empty means months_sha256. The producer requires the prior chain months to be the first months of the new list
        type: string
        default: ""
      prior_best_effort_sha256:
        description: Optional SHA-256 of the best-effort file of the prior chain, when it differs from the file of this run; empty means the file of this run
        type: string
        default: ""
      direction:
        description: forward (default) or backward. A backward run searches from the identity pose (the last month of the list; root_month must be empty) to earlier months; its artifact is a forward-reading chain.v3 that ends at the identity pose (join_end must be identity)
        type: choice
        options: [forward, backward]
        default: forward
      join_end:
        description: Optional digest the end state of the chain must have, 64 hex digits or identity (the identity pose of the print); all three checkers read it (CAL7_JOIN_END). Required with direction backward, where it must be identity
        type: string
        default: ""
      best_effort_29:
        description: The 29 rule of the best-effort edge (one wrong cell, the digit 29 in red) in all three checkers; the research commit must contain it
        type: boolean
        default: true
      fail_on_greedy:
        description: Fail the verify job (after the verified artifact is uploaded) when any edge used the greedy fallback (300-400 HTM per edge)
        type: boolean
        default: true
      smoke_mode:
        description: 3 edges, ignores prior_run_id, about 15 minutes; verifies the 3-edge chain
        type: boolean
        default: false

permissions:
  contents: read
  # Needed only to read the prior run and download its artifact.
  actions: read

concurrency:
  group: window-chain
  cancel-in-progress: false

env:
  WORKFLOW_PATH: .github/workflows/window-chain.yml
  # A prior run is only continued when it was dispatched by hand from the default branch.
  REQUIRED_PRIOR_EVENT: workflow_dispatch
  REQUIRED_PRIOR_BRANCH: main
  # research_ref must lie on this branch (git merge-base --is-ancestor).
  RESEARCH_BRANCH: research/cube-display-feasibility
  CAL: research/calendar-7x7
  WC: research/calendar-7x7/row1-window-chain

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      start: ${{ steps.validate.outputs.start }}
      end: ${{ steps.validate.outputs.end }}
      prior_run_id: ${{ steps.validate.outputs.prior_run_id }}
      max_edges: ${{ steps.validate.outputs.max_edges }}
      expect_prior_edges: ${{ steps.validate.outputs.expect_prior_edges }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the repository is public; prepare only fetches the research commit, no untrusted code runs here
      - name: Validate inputs
        id: validate
        env:
          IN_REF: ${{ inputs.research_ref }}
          IN_START: ${{ inputs.start }}
          IN_END: ${{ inputs.end }}
          IN_MONTHS_PATH: ${{ inputs.months_path }}
          IN_MONTHS_SHA: ${{ inputs.months_sha256 }}
          IN_ROOT: ${{ inputs.root_month }}
          IN_PRINT_PATH: ${{ inputs.print_path }}
          IN_PRINT_SHA: ${{ inputs.print_sha256 }}
          IN_LAYOUT_PATH: ${{ inputs.layout_path }}
          IN_LAYOUT_SHA: ${{ inputs.layout_sha256 }}
          IN_BEST: ${{ inputs.best_effort_path }}
          IN_CLAIMS: ${{ inputs.claims_path }}
          IN_LIBRARY: ${{ inputs.library }}
          IN_WIDTH: ${{ inputs.width }}
          IN_LAMBDA: ${{ inputs.lambda }}
          IN_PRIOR: ${{ inputs.prior_run_id }}
          IN_SMOKE: ${{ inputs.smoke_mode }}
          IN_MAX: ${{ inputs.max_edges }}
          IN_EXPECT: ${{ inputs.expect_prior_edges }}
          IN_PRIOR_MONTHS_SHA: ${{ inputs.prior_months_sha256 }}
          IN_PRIOR_BEST_SHA: ${{ inputs.prior_best_effort_sha256 }}
          IN_DIRECTION: ${{ inputs.direction }}
          IN_JOIN_END: ${{ inputs.join_end }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          ym='^(19[0-9]{2}|20[0-9]{2}|2100)-(0[1-9]|1[0-2])$'
          path='^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$'
          ymok() { [[ "$1" =~ $ym ]] && [[ ! "$1" > 2100-01 ]]; }
          [[ "$IN_REF" =~ ^[0-9a-f]{40}$ ]] || fail "research_ref must be a 40-digit lowercase hex commit SHA"
          [ -z "$IN_ROOT" ] || ymok "$IN_ROOT" || fail "root_month must be YYYY-MM between 1900-01 and 2100-01"
          [ -z "$IN_START" ] || ymok "$IN_START" || fail "start must be YYYY-MM between 1900-01 and 2100-01"
          [ -z "$IN_END" ] || ymok "$IN_END" || fail "end must be YYYY-MM between 1900-01 and 2100-01"
          [[ "$IN_MONTHS_PATH" =~ $path ]] && [[ "$IN_MONTHS_PATH" != *..* ]] || fail "months_path is not a plain repository path"
          [[ "$IN_MONTHS_SHA" =~ ^[0-9a-f]{64}$ ]] || fail "months_sha256 must be 64 lowercase hex digits"
          [[ "$IN_PRINT_PATH" =~ $path ]] && [[ "$IN_PRINT_PATH" != *..* ]] || fail "print_path is not a plain repository path"
          [ -z "$IN_BEST" ] || { [[ "$IN_BEST" =~ $path ]] && [[ "$IN_BEST" != *..* ]]; } || fail "best_effort_path is not a plain repository path"
          [ -z "$IN_CLAIMS" ] || { [[ "$IN_CLAIMS" =~ $path ]] && [[ "$IN_CLAIMS" != *..* ]]; } || fail "claims_path is not a plain repository path"
          [[ "$IN_PRINT_SHA" =~ ^[0-9a-f]{64}$ ]] || fail "print_sha256 must be 64 lowercase hex digits"
          [ -z "$IN_LAYOUT_PATH" ] || { [[ "$IN_LAYOUT_PATH" =~ $path ]] && [[ "$IN_LAYOUT_PATH" != *..* ]]; } || fail "layout_path is not a plain repository path"
          [ -z "$IN_LAYOUT_PATH" ] || [[ "$IN_LAYOUT_SHA" =~ ^[0-9a-f]{64}$ ]] || fail "layout_path needs layout_sha256 (64 lowercase hex digits)"
          [ -n "$IN_LAYOUT_PATH" ] || [ -z "$IN_LAYOUT_SHA" ] || fail "layout_sha256 needs layout_path"
          [[ "$IN_LIBRARY" =~ ^L[145]$ ]] || fail "library must be L1, L4 or L5"
          [[ "$IN_WIDTH" =~ ^[1-9][0-9]{0,2}$ ]] && [ "$IN_WIDTH" -le 200 ] || fail "width must be 1-200"
          [[ "$IN_LAMBDA" =~ ^([1-9]|10)$ ]] || fail "lambda must be 1-10"
          [ -z "$IN_PRIOR" ] || [[ "$IN_PRIOR" =~ ^[0-9]{1,20}$ ]] || fail "prior_run_id must be digits"
          [ -z "$IN_MAX" ] || { [[ "$IN_MAX" =~ ^[1-9][0-9]{0,4}$ ]] && [ "$IN_MAX" -le 100000 ]; } || fail "max_edges must be 1-100000"
          [ -z "$IN_EXPECT" ] || [[ "$IN_EXPECT" =~ ^[1-9][0-9]{0,4}$ ]] || fail "expect_prior_edges must be a positive number"
          [ -z "$IN_EXPECT" ] || [ -n "$IN_PRIOR" ] || fail "expect_prior_edges needs prior_run_id"
          [ -z "$IN_PRIOR_MONTHS_SHA" ] || [[ "$IN_PRIOR_MONTHS_SHA" =~ ^[0-9a-f]{64}$ ]] || fail "prior_months_sha256 must be 64 lowercase hex digits"
          [ -z "$IN_PRIOR_BEST_SHA" ] || [[ "$IN_PRIOR_BEST_SHA" =~ ^[0-9a-f]{64}$ ]] || fail "prior_best_effort_sha256 must be 64 lowercase hex digits"
          [ -z "$IN_PRIOR_MONTHS_SHA$IN_PRIOR_BEST_SHA" ] || [ -n "$IN_PRIOR" ] || fail "prior_*_sha256 need prior_run_id"
          [ "$IN_SMOKE" = "true" ] || [ -z "$IN_PRIOR" ] || [ -n "$IN_EXPECT" ] || fail "prior_run_id needs expect_prior_edges (the edge count of the prior chain)"
          [ -z "$IN_JOIN_END" ] || [ "$IN_JOIN_END" = identity ] || [[ "$IN_JOIN_END" =~ ^[0-9a-f]{64}$ ]] || fail "join_end must be identity or 64 lowercase hex digits"
          if [ "$IN_DIRECTION" = backward ]; then
            [ -z "$IN_ROOT" ] || fail "direction backward needs an empty root_month (the identity pose is the last month of the list)"
            [ "$IN_JOIN_END" = identity ] || fail "direction backward needs join_end=identity"
          fi
          max=${IN_MAX:-100000}; prior=$IN_PRIOR
          if [ "$IN_SMOKE" = "true" ]; then max=3; prior=""; fi
          expect=$IN_EXPECT; [ -n "$prior" ] || expect=""
          { echo "start=$IN_START"; echo "end=$IN_END"; echo "prior_run_id=$prior"; echo "max_edges=$max"; echo "expect_prior_edges=$expect"; } >> "$GITHUB_OUTPUT"
      - name: Check prior run
        if: steps.validate.outputs.prior_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR: ${{ steps.validate.outputs.prior_run_id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          # The API path is scoped to this repository, so a foreign run id is a 404.
          IFS=$'\t' read -r path conclusion event branch < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR" --jq '[.path, .conclusion, .event, .head_branch] | @tsv')
          [ "${path%%@*}" = "$WORKFLOW_PATH" ] || fail "run $PRIOR is not a run of $WORKFLOW_PATH ($path)"
          [ "$event" = "$REQUIRED_PRIOR_EVENT" ] || fail "run $PRIOR was started by '$event', not '$REQUIRED_PRIOR_EVENT'"
          [ "$branch" = "$REQUIRED_PRIOR_BRANCH" ] || fail "run $PRIOR ran from branch '$branch', not '$REQUIRED_PRIOR_BRANCH'"
          # A failed or cancelled run can be continued when it has a verified chain artifact: that artifact is uploaded only
          # after the three checkers accepted the cumulative chain, and the next run re-verifies the whole chain anyway.
          n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR/artifacts" --paginate --jq '[.artifacts[] | select((.name | startswith("wc-chain-")) and (.expired | not))] | length' | awk '{s+=$1} END{print s+0}')
          [ "$n" -ge 1 ] || fail "run $PRIOR ($conclusion) has no unexpired verified chain artifact"
      - name: Check research commit
        env:
          SHA: ${{ inputs.research_ref }}
          PRINT_PATH: ${{ inputs.print_path }}
          LAYOUT_PATH: ${{ inputs.layout_path }}
          MONTHS_PATH: ${{ inputs.months_path }}
          MONTHS_SHA: ${{ inputs.months_sha256 }}
          BEST_PATH: ${{ inputs.best_effort_path }}
          CLAIMS_PATH: ${{ inputs.claims_path }}
          BEST29: ${{ inputs.best_effort_29 }}
          SUMMARY_PRIOR: ${{ steps.validate.outputs.prior_run_id }}
          SUMMARY_ROOT: ${{ inputs.root_month }}
          SUMMARY_SMOKE: ${{ inputs.smoke_mode }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          # The research branch is fetched with its history, then the commit is fetched by SHA. GitHub serves any commit reachable from a ref of
          # this repository (refs/pull/N/head of fork pull requests included); a commit that no ref reaches is not fetchable. The 40-digit check
          # rules out ref names and URLs. The commit must lie on the research branch: a pull request commit that is not merged there is rejected.
          git fetch --no-tags origin "+refs/heads/$RESEARCH_BRANCH:refs/remotes/origin/$RESEARCH_BRANCH" || fail "cannot fetch $RESEARCH_BRANCH"
          git fetch --no-tags origin "$SHA" || fail "commit $SHA is not fetchable from $GITHUB_REPOSITORY"
          [ "$(git rev-parse --verify "$SHA^{commit}")" = "$SHA" ] || fail "research_ref does not resolve to itself"
          git merge-base --is-ancestor "$SHA" "refs/remotes/origin/$RESEARCH_BRANCH" || fail "research_ref is not an ancestor of $RESEARCH_BRANCH"
          missing=0
          for f in "$WC/window_chain.jl" "$WC/window_chain_lib.jl" "$WC/run_checks.sh" "$WC/check.jl" "$WC/verify_chain.jl" "$WC/flix/build.sh" \
                   "$CAL/global-search/search.jl" "$CAL/upright-beam/beam2.jl" "$PRINT_PATH" "$MONTHS_PATH" ${BEST_PATH:+"$BEST_PATH"} ${CLAIMS_PATH:+"$CLAIMS_PATH"}; do
            git cat-file -e "$SHA:$f" 2>/dev/null || { echo "::error::$f is missing at $SHA"; missing=1; }
          done
          [ -z "$LAYOUT_PATH" ] || git cat-file -e "$SHA:$LAYOUT_PATH" || fail "$LAYOUT_PATH is missing at $SHA"
          [ -z "$LAYOUT_PATH" ] || git grep -qw CAL7_WINDOW_LAYOUT "$SHA" -- "$WC/window_chain.jl" || fail "layout_path is set, but the producer at research_ref does not read CAL7_WINDOW_LAYOUT"
          [ -z "$LAYOUT_PATH" ] || git grep -qw CAL7_WINDOW_LAYOUT "$SHA" -- "$WC/run_checks.sh" || fail "layout_path is set, but run_checks.sh at research_ref does not read CAL7_WINDOW_LAYOUT"
          # The 29 rule is read by the three checkers at research_ref; a commit without it would accept a best-effort edge on any wrong cell.
          [ "$BEST29" != true ] || git grep -qw CAL7_BEST_EFFORT_29 "$SHA" -- "$WC/run_checks.sh" || fail "best_effort_29 is set, but run_checks.sh at research_ref does not read CAL7_BEST_EFFORT_29"
          [ "$BEST29" != true ] || git grep -qw CAL7_BEST_EFFORT_29 "$SHA" -- "$WC/check.jl" || fail "best_effort_29 is set, but check.jl at research_ref does not read CAL7_BEST_EFFORT_29"
          [ "$BEST29" != true ] || git grep -qw CAL7_BEST_EFFORT_29 "$SHA" -- "$WC/verify_chain.jl" || fail "best_effort_29 is set, but verify_chain.jl at research_ref does not read CAL7_BEST_EFFORT_29"
          [ "$missing" = 0 ] || fail "research commit lacks required files"
          [ "$(git show "$SHA:$MONTHS_PATH" | sha256sum | cut -d' ' -f1)" = "$MONTHS_SHA" ] || fail "month list differs from months_sha256"
          {
            echo "### Window chain"
            echo "- research SHA: \`$SHA\`"
            echo "- print: \`$PRINT_PATH\`, month list \`$MONTHS_PATH\` (\`$MONTHS_SHA\`), root \`${SUMMARY_ROOT:-first month of the list}\`"
            echo "- layout: \`${LAYOUT_PATH:-row1-revision/layout.tsv (default)}\`"
            echo "- smoke: \`$SUMMARY_SMOKE\`, prior run: \`$SUMMARY_PRIOR\`, 29 rule: \`$BEST29\`"
          } >> "$GITHUB_STEP_SUMMARY"

  produce:
    needs: [prepare]
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      SHA: ${{ inputs.research_ref }}
      PRINT_PATH: ${{ inputs.print_path }}
      PRINT_SHA: ${{ inputs.print_sha256 }}
      MONTHS_PATH: ${{ inputs.months_path }}
      MONTHS_SHA: ${{ inputs.months_sha256 }}
      PRIOR_MONTHS_SHA: ${{ inputs.prior_months_sha256 }}
      PRIOR_BEST_SHA: ${{ inputs.prior_best_effort_sha256 }}
      DIRECTION: ${{ inputs.direction }}
      JOIN_END: ${{ inputs.join_end }}
      ROOT_MONTH: ${{ inputs.root_month }}
      BEST_PATH: ${{ inputs.best_effort_path }}
      CLAIMS_PATH: ${{ inputs.claims_path }}
      LAYOUT_PATH: ${{ inputs.layout_path }}
      LAYOUT_SHA: ${{ inputs.layout_sha256 }}
      START: ${{ needs.prepare.outputs.start }}
      END: ${{ needs.prepare.outputs.end }}
      MAX_EDGES: ${{ needs.prepare.outputs.max_edges }}
      EXPECT_PRIOR: ${{ needs.prepare.outputs.expect_prior_edges }}
      BEST29: ${{ inputs.best_effort_29 }}
      LIBRARY: ${{ inputs.library }}
      WIDTH: ${{ inputs.width }}
      LAMBDA: ${{ inputs.lambda }}
      # One segment is about an hour: no new edge is started when the slowest edge so far would not fit before 3000 s of the edge loop
      # (the library build, about 1-2 min, comes before it); the job limit is 70 min.
      GENERATE_DEADLINE_S: "3000"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.research_ref }}
          path: src
          persist-credentials: false
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13.3"
      - name: Download prior run artifact
        if: needs.prepare.outputs.prior_run_id != ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wc-chain-*
          path: prev
          run-id: ${{ needs.prepare.outputs.prior_run_id }}
          github-token: ${{ github.token }}
      - name: Prepare work directory
        run: |
          set -euo pipefail
          echo "$PRINT_SHA  src/$PRINT_PATH" | sha256sum --check --strict
          echo "$MONTHS_SHA  src/$MONTHS_PATH" | sha256sum --check --strict
          [ -z "$CLAIMS_PATH" ] || test -f "src/$CLAIMS_PATH"
          [ -z "$BEST_PATH" ] || test -f "src/$BEST_PATH"
          mkdir -p "$GITHUB_WORKSPACE/out"
          BEST_SHA=-; [ -z "$BEST_PATH" ] || BEST_SHA=$(sha256sum "src/$BEST_PATH" | cut -d' ' -f1)
          if [ -d "$GITHUB_WORKSPACE/prev" ]; then
            # A prior artifact is untrusted input. SHA256SUMS and VERIFIED.txt only show that it is self-consistent; the producer replays the chain
            # and checks its end digest, and the verify job re-checks the whole chain. Take the chain with the most edges.
            best=""; most=-1
            while IFS= read -r marker; do
              d=$(dirname "$marker")
              (cd "$d" && sha256sum --check --strict SHA256SUMS >/dev/null) || { echo "::error::checksum failure in $d"; exit 1; }
              n=$(sed -n 's/^edges_total=\([0-9]\{1,\}\)$/\1/p' "$marker" | head -n 1)
              [ -n "$n" ] || continue
              if [ "$n" -gt "$most" ]; then most=$n; best=$d; fi
            done < <(find "$GITHUB_WORKSPACE/prev" -name VERIFIED.txt)
            [ -n "$best" ] || { echo "::error::no verified chain artifact found to continue"; exit 1; }
            grep -qx "print_sha256=$PRINT_SHA" "$best/VERIFIED.txt" || { echo "::error::the prior chain was produced with another print"; exit 1; }
            grep -qx "months_sha256=${PRIOR_MONTHS_SHA:-$MONTHS_SHA}" "$best/VERIFIED.txt" || { echo "::error::the prior chain was produced with another month list"; exit 1; }
            grep -qx "root_month=${ROOT_MONTH:--}" "$best/VERIFIED.txt" || { echo "::error::the prior chain was produced with another root month"; exit 1; }
            grep -qx "layout_sha256=${LAYOUT_SHA:--}" "$best/VERIFIED.txt" || { echo "::error::the prior chain was produced with another layout"; exit 1; }
            # An artifact of an older run has no direction and no join_end line: forward, none.
            pd=$(sed -n 's/^direction=//p' "$best/VERIFIED.txt" | head -n 1); [ "${pd:-forward}" = "$DIRECTION" ] || { echo "::error::the prior chain was produced with another direction"; exit 1; }
            pj=$(sed -n 's/^join_end=//p' "$best/VERIFIED.txt" | head -n 1); [ "${pj:--}" = "${JOIN_END:--}" ] || { echo "::error::the prior chain was checked with another join_end"; exit 1; }

            # A prior chain on another (shorter) month list is complete for that list; it is continued, so only an unchanged list needs complete=false.
            [ "${PRIOR_MONTHS_SHA:-$MONTHS_SHA}" != "$MONTHS_SHA" ] || grep -qx "complete=false" "$best/VERIFIED.txt" || { echo "::error::the prior chain is complete; there is nothing to continue"; exit 1; }
            [ -z "$EXPECT_PRIOR" ] || [ "$most" = "$EXPECT_PRIOR" ] || { echo "::error::the prior chain has $most edges, expect_prior_edges is $EXPECT_PRIOR"; exit 1; }
            grep -qx "best_effort_29=$BEST29" "$best/VERIFIED.txt" || { echo "::error::the prior chain was checked with another best_effort_29 setting"; exit 1; }
            grep -qx "best_effort_sha256=${PRIOR_BEST_SHA:-$BEST_SHA}" "$best/VERIFIED.txt" || { echo "::error::the prior chain was produced with another best-effort file"; exit 1; }
            # The producer reads prior/chain.moves.tsv, prior/edges.tsv (the solver record of earlier segments), prior/segments.tsv
            # (the inputs of earlier segments) and prior/states.
            mkdir "$GITHUB_WORKSPACE/prior"
            cp "$best/chain.moves.tsv" "$best/edges.tsv" "$best/segments.tsv" "$GITHUB_WORKSPACE/prior/"; cp -R "$best/states" "$GITHUB_WORKSPACE/prior/states"
            echo "PRIOR_DIR=$GITHUB_WORKSPACE/prior" >> "$GITHUB_ENV"
            echo "continuing from $best ($most edges)"
          fi
      - name: Produce edges
        run: |
          set -euo pipefail
          out=$GITHUB_WORKSPACE/out/chain
          args=(max_edges="$MAX_EDGES" library="$LIBRARY" width="$WIDTH" lambda="$LAMBDA" run_id="$GITHUB_RUN_ID" research_ref="$SHA")
          [ -z "$START" ] || args+=(start="$START")
          [ -z "$END" ] || args+=(end="$END")
          [ -z "${PRIOR_DIR:-}" ] || args+=(prior="$PRIOR_DIR")
          [ -z "$CLAIMS_PATH" ] || args+=(claims="$GITHUB_WORKSPACE/src/$CLAIMS_PATH")
          [ -z "$BEST_PATH" ] || args+=(best_effort="$GITHUB_WORKSPACE/src/$BEST_PATH")
          [ "$DIRECTION" != backward ] || args+=(direction=backward)
          # The run contract of the checkers: month list S, its pin, the print pin and the root month.
          export CAL7_WINDOW_MONTHS="$GITHUB_WORKSPACE/src/$MONTHS_PATH" CAL7_WINDOW_MONTHS_SHA256="$MONTHS_SHA" CAL7_WINDOW_PRINT_SHA="$PRINT_SHA"
          [ -z "$ROOT_MONTH" ] || export CAL7_ROOT_MONTH="$ROOT_MONTH"
          # An optional window-local layout, read by the producer: checked against its pin here.
          [ -z "$LAYOUT_PATH" ] || { echo "$LAYOUT_SHA  src/$LAYOUT_PATH" | sha256sum --check --strict; export CAL7_WINDOW_LAYOUT="$GITHUB_WORKSPACE/src/$LAYOUT_PATH" CAL7_WINDOW_LAYOUT_SHA256="$LAYOUT_SHA"; }
          julia --version; nproc
          set +e
          timeout 65m julia --startup-file=no --threads=4 "src/$WC/window_chain.jl" "$out" "src/$PRINT_PATH" "${args[@]}" 2>&1 | tee "$GITHUB_WORKSPACE/out/run.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" = 3 ]; then echo "::error::no new edge: the deadline passed or the search stalled before the first edge of this run (exit 3); nothing to verify or continue from"; exit 3; fi
          [ "$rc" = 0 ] || { echo "::error::producer exited with $rc (124 = timeout)"; exit "$rc"; }
          cat "$out/PROGRESS.txt"
          test -s "$out/chain.moves.tsv" && test -s "$out/months.tsv" && test -s "$out/segments.tsv"
          cp "$GITHUB_WORKSPACE/out/run.log" "$out/run.log"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wc-candidate-${{ github.run_id }}
          path: out/chain/
          retention-days: 90
          if-no-files-found: error

  verify:
    needs: [prepare, produce]
    runs-on: ubuntu-24.04
    timeout-minutes: 345
    env:
      SHA: ${{ inputs.research_ref }}
      FAIL_ON_GREEDY: ${{ inputs.fail_on_greedy }}
      BEST29: ${{ inputs.best_effort_29 }}
      BEST_PATH: ${{ inputs.best_effort_path }}
      PRINT_PATH: ${{ inputs.print_path }}
      LAYOUT_PATH: ${{ inputs.layout_path }}
      LAYOUT_SHA: ${{ inputs.layout_sha256 }}
      PRINT_SHA: ${{ inputs.print_sha256 }}
      MONTHS_PATH: ${{ inputs.months_path }}
      MONTHS_SHA: ${{ inputs.months_sha256 }}
      ROOT_MONTH: ${{ inputs.root_month }}
      DIRECTION: ${{ inputs.direction }}
      JOIN_END: ${{ inputs.join_end }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ inputs.research_ref }}
          path: src
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13.3"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wc-candidate-${{ github.run_id }}
          path: cand
      - name: Build Flix verifier jar
        run: |
          set -euo pipefail
          # flixw downloads flix.jar from a GitHub release and the dependencies from Maven; a transient 5xx there fails the build,
          # so retry (the build itself is deterministic) but never on a compile error.
          export CALENDAR7_CHAIN_FLIX_BUILD_DIR=$RUNNER_TEMP/flix-build
          for attempt in 1 2 3 4 5 6; do
            if built=$(bash "src/$WC/flix/build.sh" 2>&1); then break; fi
            printf "%s\n" "$built" | tail -n 30
            printf "%s\n" "$built" | grep -qE 'FLIXW005|HTTP 5[0-9][0-9]' || { echo "::error::Flix build failed (not a download error)"; exit 1; }
            [ "$attempt" -lt 6 ] || { echo "::error::Flix download failed six times"; exit 1; }
            echo "::warning::Flix download attempt $attempt failed; retrying"; sleep $((attempt * 60))
            rm -rf "$CALENDAR7_CHAIN_FLIX_BUILD_DIR"
          done
          jar=$(find "$CALENDAR7_CHAIN_FLIX_BUILD_DIR/artifact" -name "*.jar" | head -n 1)
          test -f "$jar"
          echo "FLIX_JAR=$jar" >> "$GITHUB_ENV"
          sha256sum "$jar" | tee "$RUNNER_TEMP/flix-jar.sha256"
      - name: Verify chain (Julia, Flix, independent replay)
        run: |
          set -euo pipefail
          c=$GITHUB_WORKSPACE/cand
          echo "$PRINT_SHA  src/$PRINT_PATH" | sha256sum --check --strict
          chain_end=$(sed -n 's/^chain_end=\([0-9]\{4\}-[0-9]\{2\}\)$/\1/p' "$c/PROGRESS.txt")
          edges_total=$(sed -n 's/^edges_total=\([0-9]\{1,\}\)$/\1/p' "$c/PROGRESS.txt")
          complete=$(sed -n 's/^complete=\(true\|false\)$/\1/p' "$c/PROGRESS.txt")
          [ -n "$chain_end" ] && [ -n "$edges_total" ] && [ -n "$complete" ] || { echo "::error::PROGRESS.txt is incomplete"; exit 1; }
          [ "$edges_total" -ge 1 ] || { echo "::error::no edge to verify"; exit 1; }
          echo "$MONTHS_SHA  src/$MONTHS_PATH" | sha256sum --check --strict
          best_effort=$(sed -n 's/^best_effort_edges=\([0-9]\{1,\}\)$/\1/p' "$c/PROGRESS.txt")
          [ -n "$best_effort" ] || { echo "::error::PROGRESS.txt has no best_effort_edges"; exit 1; }
          # The checkers want a month list that ends at the last chain edge (they assert it); a stopped segment is checked against the
          # members of S up to chain_end (YYYY-MM sorts as text). The root month stays the parameter of the run.
          cut=$GITHUB_WORKSPACE/out/months-cut.tsv
          # A backward run reaches back from the end of the list: PROGRESS.txt has chain_start (the earliest month reached), and the members of S from chain_start
          # on are the list of the exported chain.v3 (chain_end is the last member, the identity pose).
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ "$DIRECTION" = backward ]; then
            chain_start=$(sed -n 's/^chain_start=\([0-9]\{4\}-[0-9]\{2\}\)$/\1/p' "$c/PROGRESS.txt")
            if [ -z "$chain_start" ] || ! grep -qx "direction=backward" "$c/PROGRESS.txt"; then echo "::error::PROGRESS.txt of a backward run has no chain_start"; exit 1; fi
            awk -v start="$chain_start" '$0 >= start' "src/$MONTHS_PATH" > "$cut"
          else
            awk -v end="$chain_end" '$0 <= end' "src/$MONTHS_PATH" > "$cut"
          fi
          cut_sha=$(sha256sum "$cut" | cut -d' ' -f1)
          export CAL7_WINDOW_MONTHS=$cut CAL7_WINDOW_MONTHS_SHA256=$cut_sha CAL7_WINDOW_PRINT_SHA=$PRINT_SHA
          [ -z "$ROOT_MONTH" ] || export CAL7_ROOT_MONTH=$ROOT_MONTH
          # The end state of the chain: identity for a backward chain (the checkers compare its digest with the identity pose of the print); run_checks.sh gives it to Flix too.
          [ -z "$JOIN_END" ] || export CAL7_JOIN_END=$JOIN_END
          export PRINT_OVERRIDE=$GITHUB_WORKSPACE/src/$PRINT_PATH CHAIN_OVERRIDE=$c/chain.moves.tsv STATES_OVERRIDE=$c/states
          # An optional window-local layout: checked against its pin here, then read by all three checkers through run_checks.sh.
          [ -z "$LAYOUT_PATH" ] || { echo "$LAYOUT_SHA  src/$LAYOUT_PATH" | sha256sum --check --strict; export CAL7_WINDOW_LAYOUT="$GITHUB_WORKSPACE/src/$LAYOUT_PATH" CAL7_WINDOW_LAYOUT_SHA256="$LAYOUT_SHA"; }
          # The 29 rule of the best-effort edge: the Julia checkers read the variable, run_checks.sh gives the Flix checker the last argument 29.
          [ "$BEST29" != true ] || export CAL7_BEST_EFFORT_29=1
          mkdir -p "$GITHUB_WORKSPACE/out"
          bash "src/$WC/run_checks.sh" "$(command -v julia)" "$(command -v java)" "$FLIX_JAR" "$GITHUB_WORKSPACE/out/checks" 2>&1 | tee "$GITHUB_WORKSPACE/out/verify.log"
          out=$GITHUB_WORKSPACE/out/checks
          cmp "$out/julia.tsv" "$out/flix.tsv" || { echo "::error::Julia and Flix receipts differ"; exit 1; }
          # An exact chain has the SAT verdict; a chain with best-effort edges (chain.v2, written by the producer for the months of the best-effort file) has BEST_EFFORT and its status line.
          if [ "$best_effort" = 0 ]; then jv=SAT; iv=ACCEPT_CHAIN; else jv=BEST_EFFORT; iv=ACCEPT_BEST_EFFORT_CHAIN; fi
          grep -qx $'verdict\t'"$jv"$'\tlegal-retained-state-window-chain\t'"$((edges_total + 1))"$'\t'"$edges_total" "$out/julia.tsv" || { echo "::error::Julia verdict line is not the exact $jv line for $edges_total edges"; exit 1; }
          grep -q $'^independent-verdict\t'"$iv"$'\t'"$((edges_total + 1))"$'\t'"$edges_total"$'\t' "$out/independent.tsv" || { echo "::error::independent verdict differs ($edges_total edges)"; exit 1; }
          [ "$best_effort" = 0 ] || grep -qx $'status\texact\t'"$((edges_total - best_effort))"$'\tbest_effort\t'"$best_effort" "$out/julia.tsv" || { echo "::error::Julia status line differs from $best_effort best-effort edges"; exit 1; }
          lines=$(grep -c $'^edge\t' "$c/chain.moves.tsv")
          [ "$lines" = "$edges_total" ] || { echo "::error::chain has $lines edges, PROGRESS.txt says $edges_total"; exit 1; }
          # The solver record: edges.tsv is cumulative (column 4 is beam, finishN or greedy); PROGRESS.txt must agree with it.
          greedy=$(awk -F'\t' 'NR>1 && $4=="greedy"' "$c/edges.tsv" | wc -l)
          [ "$greedy" = "$(sed -n 's/^greedy_edges=\([0-9]\{1,\}\)$/\1/p' "$c/PROGRESS.txt")" ] || { echo "::error::greedy edge count of PROGRESS.txt differs from edges.tsv"; exit 1; }
          [ "$(awk 'NR>1' "$c/edges.tsv" | wc -l)" = "$edges_total" ] || { echo "::error::edges.tsv does not list $edges_total edges"; exit 1; }
          [ "$greedy" = 0 ] || echo "::warning::$greedy of $edges_total edges used the greedy fallback (300-400 HTM per edge)"
          echo "greedy fallback edges: $greedy of $edges_total"
          { echo "CHAIN_END=$chain_end"; echo "EDGES_TOTAL=$edges_total"; echo "COMPLETE=$complete"; echo "GREEDY=$greedy"; } >> "$GITHUB_ENV"
      - name: Package artifact
        run: |
          set -euo pipefail
          c=$GITHUB_WORKSPACE/cand; out=$GITHUB_WORKSPACE/out/checks; pack=$GITHUB_WORKSPACE/pack
          mkdir -p "$pack/states"
          cp "$c/chain.moves.tsv" "$c/months.tsv" "$c/edges.tsv" "$c/segments.tsv" "$c/PROGRESS.txt" "$c/run.log" "$pack/"
          cp "$c"/states/*.tsv "$pack/states/"
          BEST_SHA=-; [ -z "$BEST_PATH" ] || BEST_SHA=$(sha256sum "src/$BEST_PATH" | cut -d' ' -f1)
          cp "$out/julia.tsv" "$out/flix.tsv" "$out/independent.tsv" "$RUNNER_TEMP/flix-jar.sha256" "$pack/"
          {
            echo "research_ref_sha=$SHA"; echo "run_id=$GITHUB_RUN_ID"; echo "print_sha256=$PRINT_SHA"
            echo "months_sha256=$MONTHS_SHA"; echo "root_month=${ROOT_MONTH:--}"
            echo "layout_sha256=${LAYOUT_SHA:--}"
            echo "direction=$DIRECTION"; echo "join_end=${JOIN_END:--}"
            echo "best_effort_29=$BEST29"
            echo "best_effort_sha256=$BEST_SHA"
            echo "edges_total=$EDGES_TOTAL"; echo "chain_end=$CHAIN_END"; echo "complete=$COMPLETE"
          } > "$pack/VERIFIED.txt"
          sums=$(cd "$pack" && find . -type f | sort | xargs sha256sum)
          printf "%s\n" "$sums" > "$pack/SHA256SUMS"
          {
            echo "### Window chain verified"
            echo "- research SHA: \`$SHA\`, print: \`$PRINT_SHA\`"
            echo "- layout: \`${LAYOUT_PATH:--}\`, \`${LAYOUT_SHA:--}\`"
            echo "- edges: $EDGES_TOTAL, chain end: $CHAIN_END, complete: $COMPLETE, greedy fallback edges: $GREEDY"
            echo "- $(tail -n 1 "$out/julia.tsv" | tr '\t' ' ') / $(tail -n 1 "$out/independent.tsv" | tr '\t' ' ')"
            echo '```'; cat "$pack/PROGRESS.txt"; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wc-chain-${{ github.run_id }}
          path: pack/
          retention-days: 90
          if-no-files-found: error
      - name: State report
        timeout-minutes: 10
        continue-on-error: true
        run: |
          set -euo pipefail
          # Runs after the verified chain artifact is uploaded, so a hang (10 min limit) or a failure cannot lose a stage. Extra artifact, not part of the verified chain: repeated start/end states, pairs and configuration transitions of the whole chain.
          # Tools from research commits without it are skipped; a failing report does not fail the run (the chain is already verified).
          mkdir -p "$GITHUB_WORKSPACE/report"
          if [ -f "src/$WC/state_report.sh" ]; then
            if bash "src/$WC/state_report.sh" "$GITHUB_WORKSPACE/cand/chain.moves.tsv" "$GITHUB_WORKSPACE/cand/states" "$(command -v julia)" > "$GITHUB_WORKSPACE/report/state-report.txt" 2> "$GITHUB_WORKSPACE/report/state-report.err"; then
              { echo "### State report"; echo '```'; head -n 60 "$GITHUB_WORKSPACE/report/state-report.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            else
              echo "::warning::state_report.sh failed (see state-report.err); the chain is verified"
            fi
          else
            echo "::notice::state_report.sh does not exist at research_ref; no state report"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wc-state-report-${{ github.run_id }}
          path: report/
          retention-days: 90
          if-no-files-found: ignore
      - name: Greedy gate
        if: env.FAIL_ON_GREEDY == 'true' && env.GREEDY != '0'
        run: |
          # The verified artifact is already uploaded, so a continuation with fail_on_greedy=false stays possible.
          echo "::error::$GREEDY edge(s) used the greedy fallback; the chain is verified and uploaded, but fail_on_greedy is true"
          exit 1
      - name: Collect failure logs
        if: failure() || cancelled()
        run: |
          mkdir -p "$GITHUB_WORKSPACE/fail"
          cp -f "$GITHUB_WORKSPACE"/out/verify.log "$GITHUB_WORKSPACE"/out/checks/*.tsv "$GITHUB_WORKSPACE/fail/" 2>/dev/null || true
          # Not a chain artifact: no VERIFIED.txt, never used as a prior.
          echo "verify failed or was cancelled; partial logs only" > "$GITHUB_WORKSPACE/fail/FAILED.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure() || cancelled()
        with:
          name: wc-failure-${{ github.run_id }}
          path: fail/
          retention-days: 14
          if-no-files-found: ignore
