name: Counter development preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: counter-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm run prepare:solver
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The regression builds dist with /cubistry/ and serves plain static files.
      - run: npm run test:pages
        env:
          CI: "1"
          VITE_BASE_PATH: /cubistry/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy approved main build
        id: deployment
        uses: actions/deploy-pages@v4
