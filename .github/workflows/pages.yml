name: Pages build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-build-${{ github.event.pull_request.number || github.ref }}
  # Labeling with something other than `preview` starts a run whose job is
  # skipped; it must not cancel a running preview build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'preview') }}

jobs:
  build:
    # Pull requests are built only while they carry the `preview` label. Adding
    # another label does not start a build.
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm run prepare:solver
      - run: npm ci
      # Browser tests on pull requests only run with the `e2e` label.
      - if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
        run: npx playwright install --with-deps chromium
      # Preserve the existing production WebGL/static-asset gate before upload.
      - if: github.ref == 'refs/heads/main'
        run: npm run test:pages
        env:
          CI: "1"
      - if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e')
        run: npm run test:pr-preview
        env:
          CI: "1"
      - if: github.event_name == 'pull_request'
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/cubistry/pr-preview/pr-{0}/', github.event.pull_request.number) || '/cubistry/' }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: pages-site
          path: dist/
          retention-days: 14
          overwrite: true
      # Until explicit activation, preserve the current main-only Actions deploy.
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        if: github.ref == 'refs/heads/main' && vars.PAGES_PREVIEWS_ENABLED != 'true'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && vars.PAGES_PREVIEWS_ENABLED != 'true'
    needs: build
    concurrency:
      group: counter-pages-publish
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
