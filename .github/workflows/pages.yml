name: Pages build

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-build-${{ github.event.pull_request.number || github.ref }}
  # Labeling with something other than `preview` starts a run whose job is
  # skipped; it must not cancel a running preview build.
  cancel-in-progress: ${{ github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'preview') }}

jobs:
  build:
    # Pull requests are built only while they carry the `preview` label. Adding
    # another label does not start a build.
    if: >-
      github.ref == 'refs/heads/main' ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview'))
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm run prepare:solver
      - run: npm ci
      # Browser tests on pull requests only run with the `e2e` label.
      - if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
        run: npx playwright install --with-deps chromium
      # Preserve the existing production WebGL/static-asset gate before upload.
      - if: github.ref == 'refs/heads/main'
        run: npm run test:pages
        env:
          CI: "1"
      - if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'e2e')
        run: npm run test:pr-preview
        env:
          CI: "1"
      - if: github.event_name == 'pull_request'
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ github.event_name == 'pull_request' && format('/cubistry/pr-preview/pr-{0}/', github.event.pull_request.number) || '/cubistry/' }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-site
          path: dist/
          retention-days: 14
          overwrite: true
      # Until explicit activation, preserve the current main-only Actions deploy.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main' && vars.PAGES_PREVIEWS_ENABLED != 'true'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main' && vars.PAGES_PREVIEWS_ENABLED != 'true'
    needs: build
    concurrency:
      group: counter-pages-publish
      cancel-in-progress: false
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
