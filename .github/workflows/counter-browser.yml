# SPDX-License-Identifier: AGPL-3.0-or-later
name: Counter browser checks

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  push:
    branches: [main]
  # Nightly full run of the default branch: 01:00 UTC = 02:00 CET / 03:00 CEST.
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: counter-browser-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name != 'e2e' && format('ignored-label-{0}', github.run_id) || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ (github.event_name == 'pull_request' && (github.event.action != 'labeled' || github.event.label.name == 'e2e')) || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  # The browser end-to-end suite is split into two groups of parallel shards. The
  # full six shards run on every push to main, nightly and on manual dispatch. A
  # pull request that carries the `e2e` label runs only the `fast` group (the main
  # scenario); the `timing` group waits on real animation time or asserts
  # millisecond precision (see `timingSpecs` in playwright.config.mjs) and runs
  # from main. Each shard needs its own runner because the specs run in
  # software-rendered Chromium. The `timing` group has a longer per-test limit, so
  # a slow frame cannot fail the fast group.
  e2e:
    name: e2e ${{ matrix.group }} (${{ matrix.shard }})
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'e2e') && (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host --init
    env:
      TZ: UTC
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"group":"fast","shard":1,"of":3},{"group":"fast","shard":2,"of":3},{"group":"fast","shard":3,"of":3}]}' || '{"include":[{"group":"fast","shard":1,"of":3},{"group":"fast","shard":2,"of":3},{"group":"fast","shard":3,"of":3},{"group":"timing","shard":1,"of":3},{"group":"timing","shard":2,"of":3},{"group":"timing","shard":3,"of":3}]}') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/container-workspace
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm run prepare:solver
      - run: npm ci
      - uses: ./.github/actions/browser-environment
        with:
          receipt-name: ${{ matrix.group }}-${{ matrix.shard }}
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ matrix.of }}
        env:
          CI: '1'
          CUBISTRY_E2E_GROUP: ${{ matrix.group }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: counter-browser-failure-${{ matrix.group }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # The deployed-pages and preview-infrastructure browser tests build their own
  # site and server, so they do not depend on the shards above.
  e2e-pages:
    if: github.event_name != 'pull_request' || (contains(github.event.pull_request.labels.*.name, 'e2e') && (github.event.action != 'labeled' || github.event.label.name == 'e2e'))
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host --init
    env:
      TZ: UTC
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/container-workspace
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: npm run prepare:solver
      - run: npm ci
      - uses: ./.github/actions/browser-environment
        with:
          receipt-name: pages
      - run: npm run test:pages
        env:
          CI: '1'
      - run: npm run test:pr-preview
        env:
          CI: '1'
      - name: Check Pastel Garden tiles
        run: node scripts/check-pastel-garden-tiles.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: counter-pages-browser-failure
          path: test-results/
          retention-days: 7
