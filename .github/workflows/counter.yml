name: Counter checks

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  push:
    branches: [main]
  # Nightly full run of the default branch: 01:00 UTC = 02:00 CET / 03:00 CEST.
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: counter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  counter:
    # The nightly run only repeats the browser suite; main pushes cover this job.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run prepare:solver
      - run: npm ci
      # Fetches the exact pinned research commit (by full SHA, so nothing
      # unpinned is trusted) and requires the committed H/M copies to be
      # byte-identical to it. `npm run check` alone verifies the copies only.
      - name: Verify H/M data against its pinned research commit
        run: |
          commit="$(node -p "require('./hm-source.json').commit")"
          git fetch --no-tags --depth=1 origin "$commit"
          node scripts/prepare-hm.mjs --check --require-commit
      - run: npm run check
      # Verifies the committed print presets only (no regeneration, so the zlib
      # build does not matter). Needs the pinned Python packages, so it is not
      # part of `npm run check`.
      - name: Verify committed print exports
        run: |
          python3 -m venv "$RUNNER_TEMP/print-venv"
          "$RUNNER_TEMP/print-venv/bin/pip" install -r scripts/print-requirements.txt
          PATH="$RUNNER_TEMP/print-venv/bin:$PATH" npm run test:print-exports

  # The browser end-to-end suite is split into two groups of parallel shards. The
  # full six shards run on every push to main, nightly and on manual dispatch. A
  # pull request that carries the `e2e` label runs only the `fast` group (the main
  # scenario); the `timing` group waits on real animation time or asserts
  # millisecond precision (see `timingSpecs` in playwright.config.mjs) and runs
  # from main. Each shard needs its own runner because the specs run in
  # software-rendered Chromium. The `timing` group has a longer per-test limit, so
  # a slow frame cannot fail the fast group.
  e2e:
    name: e2e ${{ matrix.group }} (${{ matrix.shard }})
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(github.event_name == 'pull_request' && '{"include":[{"group":"fast","shard":1,"of":3},{"group":"fast","shard":2,"of":3},{"group":"fast","shard":3,"of":3}]}' || '{"include":[{"group":"fast","shard":1,"of":3},{"group":"fast","shard":2,"of":3},{"group":"fast","shard":3,"of":3},{"group":"timing","shard":1,"of":3},{"group":"timing","shard":2,"of":3},{"group":"timing","shard":3,"of":3}]}') }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run prepare:solver
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -- --shard=${{ matrix.shard }}/${{ matrix.of }}
        env:
          CI: '1'
          CUBISTRY_E2E_GROUP: ${{ matrix.group }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: counter-browser-failure-${{ matrix.group }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7

  # The deployed-pages and preview-infrastructure browser tests build their own
  # site and server, so they do not depend on the shards above.
  e2e-pages:
    if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run prepare:solver
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages
        env:
          CI: '1'
      - run: npm run test:pr-preview
        env:
          CI: '1'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        if: failure()
        with:
          name: counter-pages-browser-failure
          path: test-results/
          retention-days: 7
