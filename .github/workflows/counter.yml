name: Counter checks

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: counter-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  counter:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run prepare:solver
      - run: npm ci
      - run: npm run check
      - if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
        run: npx playwright install --with-deps chromium
      - if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
        run: npm run test:e2e
        env:
          CI: '1'
      - if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
        run: npm run test:pages
        env:
          CI: '1'
      - if: github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'e2e')
        run: npm run test:pr-preview
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: counter-browser-failure
          path: test-results/
          retention-days: 7
