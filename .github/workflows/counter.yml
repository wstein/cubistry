# SPDX-License-Identifier: AGPL-3.0-or-later
name: Counter checks

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  push:
    branches: [main]
  # Nightly full run of the default branch: 01:00 UTC = 02:00 CET / 03:00 CEST.
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: counter-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main') }}

jobs:
  counter:
    # The nightly run only repeats the browser suite; main pushes cover this job.
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:2f05f8a734509a7b3f26a912639488ee08f58a7b292d14d62271bcff9038768f
      options: --ipc=host --init
    env:
      TZ: UTC
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/container-workspace
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: npm run prepare:solver
      - run: npm ci
      # Fetches the exact pinned research commit (by full SHA, so nothing
      # unpinned is trusted) and requires the committed H/M copies to be
      # byte-identical to it. `npm run check` alone verifies the copies only.
      - name: Verify H/M data against its pinned research commit
        run: |
          commit="$(node -p "require('./hm-source.json').commit")"
          git fetch --no-tags --depth=1 origin "$commit"
          node scripts/prepare-hm.mjs --check --require-commit
      # Same for the 7x7 calendar data. The pinned commit is a commit of the merged
      # research branch, so it stays fetchable by its full SHA. An unfetchable pin
      # fails the job instead of falling back to checking the copies only.
      - name: Verify 7x7 calendar data against its pinned research commit
        run: |
          commit="$(node -p "require('./calendar7-source.json').commit")"
          git fetch --no-tags --depth=1 origin "$commit"
          node scripts/prepare-calendar7.mjs --check --require-commit
      # Keep all Chromium-dependent artwork checks enabled in the pinned image.
      - uses: ./.github/actions/browser-environment
        with:
          receipt-name: counter
      - run: npm run check
      # Verifies the committed print presets only (no regeneration, so the zlib
      # build does not matter). Needs the pinned Python packages, so it is not
      # part of `npm run check`.
      - name: Verify committed print exports
        run: |
          python3 -m venv "$RUNNER_TEMP/print-venv"
          "$RUNNER_TEMP/print-venv/bin/pip" install -r scripts/print-requirements.txt
          PATH="$RUNNER_TEMP/print-venv/bin:$PATH" npm run test:print-exports

  browser-on-demand:
    # Preserve the original manual Counter entry point and its full matrix.
    if: github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/counter-browser.yml
