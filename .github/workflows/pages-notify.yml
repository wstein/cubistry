name: Notify Pages previews

on:
  workflow_run:
    workflows: [Reconcile Pages previews]
    types: [completed]

permissions:
  contents: read
  actions: read

# Notification never holds the storage/publication lock. Keep comment writers
# serialized; each write also checks current publisher and live snapshot state.
concurrency:
  group: counter-pages-notify
  cancel-in-progress: false

jobs:
  notify:
    if: vars.PAGES_PREVIEWS_ENABLED == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: receipt
        run: node scripts/pages/notification.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - if: steps.receipt.outputs.eligible == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: ${{ steps.receipt.outputs.run }}
          name: ${{ steps.receipt.outputs.name }}
          path: receipt
      - if: steps.receipt.outputs.eligible == 'true'
        run: node scripts/pages/notify.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          PUBLISH_RUN: ${{ steps.receipt.outputs.run }}
