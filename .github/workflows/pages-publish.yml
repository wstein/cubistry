name: Reconcile Pages previews

on:
  # workflow_run cannot filter by conclusion, so every completed Pages build
  # still starts a run. For a cancelled or skipped build that run has nothing to
  # publish: it takes a per-run group and skips the plan job, so it cannot
  # occupy or displace the shared publication group. Pull request builds exist
  # only for PRs with the `preview` label (pages.yml); closed PRs are handled by
  # the pull_request_target signal below.
  workflow_run:
    workflows: [Pages build]
    types: [completed]
  # Trusted base workflow only; never check out or execute PR code here.
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  # An inactive workflow must not evict a pending legacy production deployment.
  group: ${{ vars.PAGES_PREVIEWS_ENABLED == 'true' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion)) && 'counter-pages-publish' || format('inactive-or-signal-pages-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  closed-signal:
    if: vars.PAGES_PREVIEWS_ENABLED == 'true' && github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Metadata only. A stacked PR can target a feature branch, but the
      # github-pages environment permits only main-context deployments.
      - name: Request trusted main-context reconciliation
        run: |
          gh api --method POST repos/wstein/cubistry/actions/workflows/pages-publish.yml/dispatches -f ref=main
        env:
          GH_TOKEN: ${{ github.token }}
  plan:
    permissions:
      contents: read
      actions: read
      pull-requests: read
      pages: read
    if: vars.PAGES_PREVIEWS_ENABLED == 'true' && github.event_name != 'pull_request_target' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_run' || contains(fromJSON('["success","failure"]'), github.event.workflow_run.conclusion))
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      production: ${{ steps.plan.outputs.production }}
      early: ${{ steps.plan.outputs.early }}
      previews: ${{ steps.plan.outputs.previews }}
      notify: ${{ steps.plan.outputs.notify }}
      tracked: ${{ steps.plan.outputs.tracked }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: plan
        run: node scripts/pages/plan.mjs
        env:
          GH_TOKEN: ${{ github.token }}
  production:
    if: vars.PAGES_PREVIEWS_ENABLED == 'true' && needs.plan.outputs.early == 'true'
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: stage
        run: node scripts/pages/stage.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ENTRY: ${{ needs.plan.outputs.production }}
      - if: steps.stage.outputs.action == 'deploy'
        uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4.7.4; same pin used by Ross
        with:
          branch: gh-pages
          folder: artifact-site
          clean: true
          clean-exclude: pr-preview/
          force: false
          commit-message: Update production snapshot from verified main build
  # Publish the production snapshot before slow/serial preview cleanup.
  # Preview reconciliation must never block the public site.
  previews:
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.previews == 'true' && contains(fromJSON('["success","skipped"]'), needs.production.result) && contains(fromJSON('["success","skipped"]'), needs.deploy.result) && vars.PAGES_PREVIEWS_ENABLED == 'true'
    needs: [plan, production, deploy]
    runs-on: ubuntu-latest
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - id: stage
        if: matrix.number != 0
        continue-on-error: true
        run: node scripts/pages/stage.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          ENTRY: ${{ toJSON(matrix) }}
      - if: steps.stage.outputs.action == 'deploy' || steps.stage.outputs.action == 'remove'
        uses: rossjrw/pr-preview-action@873417d2df72380da1f3978378fb58560bcde976 # v1.8.2
        with:
          action: ${{ steps.stage.outputs.action }}
          pr-number: ${{ matrix.number }}
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          source-dir: artifact-site
          pages-base-url: wstein.github.io/cubistry
          comment: false
          qr-code: false
          wait-for-pages-deployment: false
  deploy:
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.early == 'true' && needs.production.result == 'success' && vars.PAGES_PREVIEWS_ENABLED == 'true'
    needs: [plan, production]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: https://wstein.github.io/cubistry/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          path: code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          persist-credentials: false
          path: site
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: python3 code/scripts/pages/snapshot.py site combined-site
      - id: prepare
        run: node code/scripts/pages/publish.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKED: ${{ needs.plan.outputs.tracked }}
      - if: steps.prepare.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: combined-site
      - if: steps.prepare.outputs.publish == 'true'
        run: node code/scripts/pages/publish.mjs deploy
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages
  # Ross updates storage only after the production-first deployment above.
  # Publish a fresh combined snapshot after all matrix entries, including any
  # successful subset when another preview fails. Production is already live.
  deploy-previews:
    if: always() && !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.previews == 'true' && contains(fromJSON('["success","skipped"]'), needs.production.result) && contains(fromJSON('["success","skipped"]'), needs.deploy.result) && vars.PAGES_PREVIEWS_ENABLED == 'true'
    needs: [plan, production, deploy, previews]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    environment:
      name: github-pages
      url: https://wstein.github.io/cubistry/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
          path: code
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          persist-credentials: false
          path: site
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: python3 code/scripts/pages/snapshot.py site combined-site
      - id: prepare
        run: node code/scripts/pages/publish.mjs prepare
        env:
          GH_TOKEN: ${{ github.token }}
          TRACKED: ${{ needs.plan.outputs.tracked }}
      - if: steps.prepare.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          name: github-pages-previews
          path: combined-site
      - if: steps.prepare.outputs.publish == 'true'
        run: node code/scripts/pages/publish.mjs deploy
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-previews
  receipt:
    if: always() && needs.plan.result == 'success' && vars.PAGES_PREVIEWS_ENABLED == 'true'
    needs: [plan, production, previews, deploy, deploy-previews]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/pages/publish.mjs receipt
        env:
          GH_TOKEN: ${{ github.token }}
          NOTIFY: ${{ needs.plan.outputs.notify }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pages-notification-${{ github.run_attempt }}
          path: notification.json
          if-no-files-found: error
          retention-days: 7
