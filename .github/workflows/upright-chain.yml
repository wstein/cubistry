# SPDX-License-Identifier: AGPL-3.0-or-later
name: Upright chain

# Manually dispatched producer and verifier for the strict upright calendar chain of
# research/calendar-7x7 (2028-01 .. 2099-12 = 863 month edges, one retained physical state,
# strict half-turn rule: only 0 and 6/9). It cannot be dispatched until this file is on the
# default branch (main). The work is done by upright-chain-segment.yml, called once per
# segment; every segment continues the verified cumulative chain of the one before it.
#
# Cost (measured, research/calendar-7x7/upright-beam/README.md): about 30 s per edge with 4
# threads, about 70 s single-threaded (the runner has 4 cores), about 113 HTM per edge. The
# edges are strictly sequential (each starts from the retained state), so the wall time
# cannot be shortened by more processes. Defaults: 150 edges per job = about 1.3 h (2.9 h at
# 70 s), well inside the 6 h job limit; the producer additionally stops starting new edges
# after 4 h of the edge loop, so a slow run makes a shorter segment, never a failed one. The
# whole chain needs 6 segments (863 / 150); this workflow offers up to 8 per run. A shorter
# run is continued with prior_run_id.
#
# Contract with the research branch (upright-beam/chain_segment.jl): see that file.

on:
  push:
    branches: [ci/upright-chain-test2]
  workflow_dispatch:
    inputs:
      research_ref:
        description: Branch or tag of this repository that holds the research code
        type: string
        default: research/cube-display-feasibility
      start_year:
        description: Root year of a fresh chain (ignored with prior_run_id)
        type: string
        default: "2028"
      start_month:
        description: Root month of a fresh chain, 1-12 (ignored with prior_run_id)
        type: string
        default: "1"
      edges_per_job:
        description: Month edges per job (2-200; 150 is about 1.3 h)
        type: string
        default: "150"
      jobs:
        description: Number of chained jobs in this run, 1-8
        type: string
        default: "1"
      prior_run_id:
        description: Run id of an earlier run of this workflow whose last artifact is continued
        type: string
        default: ""
      smoke_mode:
        description: 4 edges from 2028-01 in one job, about 15 minutes; ignores the other numeric inputs
        type: boolean
        default: false

permissions:
  contents: read
  # Needed only to read the prior run and download its artifact.
  actions: read

concurrency:
  group: upright-chain
  cancel-in-progress: false

env:
  WORKFLOW_PATH: .github/workflows/upright-chain.yml
  # A prior run is only continued when it was dispatched by hand from this branch.
  REQUIRED_PRIOR_EVENT: push
  REQUIRED_PRIOR_BRANCH: ci/upright-chain-test2
  CAL: research/calendar-7x7

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      sha: ${{ steps.resolve.outputs.sha }}
      edges: ${{ steps.validate.outputs.edges }}
      jobs: ${{ steps.validate.outputs.jobs }}
      start: ${{ steps.validate.outputs.start }}
      prior_run_id: ${{ steps.validate.outputs.prior_run_id }}
      smoke: ${{ steps.validate.outputs.smoke }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # the repository is public; prepare only fetches refs of it, no untrusted code runs here
      - name: Validate inputs
        id: validate
        env:
          IN_YEAR: ${{ inputs.start_year || '2028' }}
          IN_MONTH: ${{ inputs.start_month || '1' }}
          IN_EDGES: ${{ inputs.edges_per_job || '2' }}
          IN_JOBS: ${{ inputs.jobs || '2' }}
          IN_PRIOR: ${{ inputs.prior_run_id || '42470374989' }}
          IN_SMOKE: ${{ inputs.smoke_mode }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          if [ "$IN_SMOKE" = "true" ]; then
            edges=4; jobs=1; start=2028-01; prior=""; smoke=true
          else
            smoke=false
            [[ "$IN_YEAR" =~ ^20[0-9]{2}$ ]] || fail "start_year must be 4 digits"
            [[ "$IN_MONTH" =~ ^([1-9]|1[0-2])$ ]] || fail "start_month must be 1-12"
            [ "$IN_YEAR" -ge 2028 ] && [ "$IN_YEAR" -le 2099 ] || fail "start_year must be 2028-2099"
            [[ "$IN_EDGES" =~ ^[1-9][0-9]{0,2}$ ]] || fail "edges_per_job must be a positive integer"
            [ "$IN_EDGES" -ge 2 ] && [ "$IN_EDGES" -le 200 ] || fail "edges_per_job must be 2-200 (above 200 does not fit the 6 h job limit at 70 s per edge)"
            [[ "$IN_JOBS" =~ ^[1-8]$ ]] || fail "jobs must be 1-8"
            [ -z "$IN_PRIOR" ] || [[ "$IN_PRIOR" =~ ^[0-9]{1,20}$ ]] || fail "prior_run_id must be digits"
            edges=$IN_EDGES; jobs=$IN_JOBS; prior=$IN_PRIOR
            start=$(printf '%04d-%02d' "$IN_YEAR" "$IN_MONTH")
          fi
          {
            echo "edges=$edges"; echo "jobs=$jobs"; echo "start=$start"
            echo "prior_run_id=$prior"; echo "smoke=$smoke"
          } >> "$GITHUB_OUTPUT"
      - name: Check prior run
        if: steps.validate.outputs.prior_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PRIOR: ${{ steps.validate.outputs.prior_run_id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          # The API path is scoped to this repository, so a foreign run id is a 404.
          IFS=$'\t' read -r path conclusion event branch < <(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR" --jq '[.path, .conclusion, .event, .head_branch] | @tsv')
          # .path may carry an @ref suffix.
          [ "${path%%@*}" = "$WORKFLOW_PATH" ] || fail "run $PRIOR is not a run of $WORKFLOW_PATH ($path)"
          [ "$event" = "$REQUIRED_PRIOR_EVENT" ] || fail "run $PRIOR was started by '$event', not '$REQUIRED_PRIOR_EVENT'"
          [ "$branch" = "$REQUIRED_PRIOR_BRANCH" ] || fail "run $PRIOR ran from branch '$branch', not '$REQUIRED_PRIOR_BRANCH'"
          # A run that failed or was cancelled after verified segments can be continued: a segment
          # artifact is uploaded only after the three checkers accepted the cumulative chain, and
          # the next segment re-checks its checksums and re-verifies the whole chain anyway, so
          # the conclusion adds no trust. It needs at least one unexpired chain artifact.
          case "$conclusion" in
            success) ;;
            failure|cancelled|timed_out)
              n=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$PRIOR/artifacts" --paginate --jq '[.artifacts[] | select((.name | startswith("upc-chain-")) and (.expired | not))] | length' | awk '{s+=$1} END{print s+0}')
              [ "$n" -ge 1 ] || fail "run $PRIOR ended with $conclusion and has no chain artifact"
              echo "::warning::continuing run $PRIOR ($conclusion) from its verified chain artifacts";;
            *) fail "run $PRIOR is not finished or has the conclusion '$conclusion'";;
          esac
      - name: Resolve research ref
        id: resolve
        env:
          REF: ${{ inputs.research_ref || 'research/strict-chain-ci' }}
          OUT_SMOKE: ${{ steps.validate.outputs.smoke }}
          OUT_JOBS: ${{ steps.validate.outputs.jobs }}
          OUT_EDGES: ${{ steps.validate.outputs.edges }}
          OUT_START: ${{ steps.validate.outputs.start }}
          OUT_PRIOR: ${{ steps.validate.outputs.prior_run_id }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$1"; exit 1; }
          [[ "$REF" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$ ]] || fail "research_ref has unsupported characters"
          case "$REF" in *..*|*//*|*.lock) fail "research_ref is not a plain ref name";; esac
          # Only a branch or tag that exists in this repository is accepted; no raw SHAs, URLs or fork refs.
          git fetch --no-tags --depth=1 origin "+refs/heads/$REF:refs/remotes/research/ref" 2>/dev/null \
            || git fetch --no-tags --depth=1 origin "+refs/tags/$REF:refs/remotes/research/ref" 2>/dev/null \
            || fail "research_ref '$REF' is not a branch or tag of $GITHUB_REPOSITORY"
          sha=$(git rev-parse --verify "refs/remotes/research/ref^{commit}")
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "research_ref $REF resolved to $sha"
          missing=0
          for f in upright-beam/chain_segment.jl upright-beam/verify_chain.jl upright-beam/chain_runner_julia.sh \
                   upright-beam/chain_runner_flix.sh upright-beam/chain_runner_replay.sh upright-beam/beam2.jl \
                   pure-split-states/pure_chain.jl pure-split-states/flix/build.sh pure-split-states/evidence/dag-all.tsv.gz \
                   upright-feasibility/evidence/print-strict-upright.tsv upright-moves/evidence/moves-strict.tsv; do
            git cat-file -e "$sha:$CAL/$f" 2>/dev/null || { echo "::error::$CAL/$f is missing at $sha"; missing=1; }
          done
          [ "$missing" = 0 ] || fail "research ref lacks required files (the strict chain verifiers and the producer are separate PRs against research/cube-display-feasibility)"
          {
            echo "### Upright chain"
            echo "- research_ref: \`$REF\`"
            echo "- resolved SHA: \`$sha\`"
            echo "- smoke: \`$OUT_SMOKE\`, jobs: $OUT_JOBS, edges per job: $OUT_EDGES, start: $OUT_START, prior run: \`$OUT_PRIOR\`"
          } >> "$GITHUB_STEP_SUMMARY"

  seg1:
    needs: [prepare]
    uses: ./.github/workflows/upright-chain-segment.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      seg: "1"
      edges: ${{ needs.prepare.outputs.edges }}
      start: ${{ needs.prepare.outputs.start }}
      smoke: ${{ needs.prepare.outputs.smoke == 'true' }}
      prior_run_id: ${{ needs.prepare.outputs.prior_run_id }}

  seg2:
    needs: [prepare, seg1]
    if: ${{ fromJSON(needs.prepare.outputs.jobs) >= 2 }}
    uses: ./.github/workflows/upright-chain-segment.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      seg: "2"
      edges: ${{ needs.prepare.outputs.edges }}
      start: ${{ needs.prepare.outputs.start }}
      smoke: ${{ needs.prepare.outputs.smoke == 'true' }}
      prev_artifact: upc-chain-${{ github.run_id }}-s1

  seg3:
    needs: [prepare, seg2]
    if: ${{ fromJSON(needs.prepare.outputs.jobs) >= 3 }}
    uses: ./.github/workflows/upright-chain-segment.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      seg: "3"
      edges: ${{ needs.prepare.outputs.edges }}
      start: ${{ needs.prepare.outputs.start }}
      smoke: ${{ needs.prepare.outputs.smoke == 'true' }}
      prev_artifact: upc-chain-${{ github.run_id }}-s2

  seg4:
    needs: [prepare, seg3]
    if: ${{ fromJSON(needs.prepare.outputs.jobs) >= 4 }}
    uses: ./.github/workflows/upright-chain-segment.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      seg: "4"
      edges: ${{ needs.prepare.outputs.edges }}
      start: ${{ needs.prepare.outputs.start }}
      smoke: ${{ needs.prepare.outputs.smoke == 'true' }}
      prev_artifact: upc-chain-${{ github.run_id }}-s3

  seg5:
    needs: [prepare, seg4]
    if: ${{ fromJSON(needs.prepare.outputs.jobs) >= 5 }}
    uses: ./.github/workflows/upright-chain-segment.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      seg: "5"
      edges: ${{ needs.prepare.outputs.edges }}
      start: ${{ needs.prepare.outputs.start }}
      smoke: ${{ needs.prepare.outputs.smoke == 'true' }}
      prev_artifact: upc-chain-${{ github.run_id }}-s4

  seg6:
    needs: [prepare, seg5]
    if: ${{ fromJSON(needs.prepare.outputs.jobs) >= 6 }}
    uses: ./.github/workflows/upright-chain-segment.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      seg: "6"
      edges: ${{ needs.prepare.outputs.edges }}
      start: ${{ needs.prepare.outputs.start }}
      smoke: ${{ needs.prepare.outputs.smoke == 'true' }}
      prev_artifact: upc-chain-${{ github.run_id }}-s5

  seg7:
    needs: [prepare, seg6]
    if: ${{ fromJSON(needs.prepare.outputs.jobs) >= 7 }}
    uses: ./.github/workflows/upright-chain-segment.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      seg: "7"
      edges: ${{ needs.prepare.outputs.edges }}
      start: ${{ needs.prepare.outputs.start }}
      smoke: ${{ needs.prepare.outputs.smoke == 'true' }}
      prev_artifact: upc-chain-${{ github.run_id }}-s6

  seg8:
    needs: [prepare, seg7]
    if: ${{ fromJSON(needs.prepare.outputs.jobs) >= 8 }}
    uses: ./.github/workflows/upright-chain-segment.yml
    with:
      sha: ${{ needs.prepare.outputs.sha }}
      seg: "8"
      edges: ${{ needs.prepare.outputs.edges }}
      start: ${{ needs.prepare.outputs.start }}
      smoke: ${{ needs.prepare.outputs.smoke == 'true' }}
      prev_artifact: upc-chain-${{ github.run_id }}-s7
