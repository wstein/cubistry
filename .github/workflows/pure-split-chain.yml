          path: src
          persist-credentials: false
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: julia-actions/setup-julia@da908477b5db94c10ffce8cfea9f2b3b9d5db687 # v3.0.3
        with:
          version: "1.13.3"
      - name: Download previous segment artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: psc-chain-${{ github.run_id }}-s3
          path: prev
      - name: Prepare work directory
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/out"
          if [ -d "$GITHUB_WORKSPACE/prev" ]; then
            # A prior artifact is untrusted input until its checksums and marker verify.
            d=$(find "$GITHUB_WORKSPACE/prev" -name VERIFIED.txt -printf '%h\n' | sort -V | tail -n 1)
            [ -n "$d" ] || { echo "::error::no verified chain artifact found in the previous step"; exit 1; }
            (cd "$d" && sha256sum --check --strict SHA256SUMS)
            cp "$d/moves.tsv" "$GITHUB_WORKSPACE/out/prior.moves.tsv"
            cp "$d/edges.tsv" "$GITHUB_WORKSPACE/out/prior.edges.tsv"
            echo "continuing from $d"
          fi
          gzip -dc "src/$PURE_DIR/evidence/dag-all.tsv.gz" > "$GITHUB_WORKSPACE/out/dag-all.tsv"
