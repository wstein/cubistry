          grep -E '^(source|edge|metrics|endpoint|status)' "$out/verify.julia.stdout" > "$out/receipt.julia.tsv"
          tail -n 2 "$out/receipt.julia.tsv"
      - name: Verify cumulative chain with Flix
        run: |
