# US English for documentation and source identifiers.
[default]
locale = "en-us"
# The German sentence of the quoted owner confirmation in the unified-application plan; a free "passt" is still reported.
extend-ignore-re = ["Stufe 3 passt"]

[files]
extend-exclude = [
  ".git/**",
  "node_modules/**",
  "dist/**",
  "build/**",
  "coverage/**",
  "results/**",
  "**/*.lock",
  "**/*.svg",
  "**/*.png",
  "**/*.jpg",
  "**/*.pdf",
  # Generated 7x7 calendar route graph: encoded move words, one character per move.
  "public/calendar7/graph.v1.json",
  "public/calendar7/names/graph.v1.json",
  "public/calendar7/names-demo/graph.v1.json",
  # Exact upstream notices: retain their original legal wording verbatim.
  "third-party/cubing/xyzzy-kilominx-NOTICE.txt",
  "third-party/cubing/fto-MIT-NOTICE.txt",
  "third-party/cubing/twips-crates/minimal-lexical-0.2.1/LICENSE.md"
]

[default.extend-words]
# Project-specific terms, not blanket spelling suppressions.
Chronocube = "Chronocube"
Cubistry = "Cubistry"
cubie = "cubie"
cubies = "cubies"
# User-specified German state word on immutable Quality Cube physical artwork.
OFFEN = "OFFEN"

# Upstream font license names the standard OpenType width axis literally.
[default.extend-identifiers]
wdth = "wdth"
# Plural of the image format name in docs/design/README.md (verbatim owner-supplied file).
PNGs = "PNGs"
# Preserve Three.js material property spelling (not prose).
metalness = "metalness"
# Preserve ReportLab's exact public method name.
drawCentredString = "drawCentredString"

# Preserve one immutable upstream crate identifier in its provenance inventory.
# This does not permit the spelling in application code or authored prose.
[type.cubing-crate-inventory]
extend-glob = ["twips-crate-notices.json"]

[type.cubing-crate-inventory.extend-words]
writeable = "writeable"
