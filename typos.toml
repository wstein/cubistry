# US English for documentation and source identifiers.
[default]
locale = "en-us"

[files]
extend-exclude = [
  ".git/**",
  "node_modules/**",
  "dist/**",
  "build/**",
  "coverage/**",
  "results/**",
  "**/*.lock",
  "**/*.svg",
  "**/*.png",
  "**/*.jpg",
  "**/*.pdf"
]

[default.extend-words]
# Project-specific terms, not blanket spelling suppressions.
Chronocube = "Chronocube"
Cubistry = "Cubistry"
cubie = "cubie"
cubies = "cubies"
Zettel = "Zettel"

# Upstream font license names the standard OpenType width axis literally.
[default.extend-identifiers]
wdth = "wdth"
