<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="refresh" content="0; url=clock.html" />
    <link rel="canonical" href="clock.html" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Cubistry · Live clock</title>
    <script>
      const target = new URLSearchParams(location.search).get("application");
      const dest = target
        ? (target === "counter" ? "counter.html" : `${target}.html`)
        : "clock.html";
      location.replace(dest + location.search + location.hash);
    </script>
  </head>
  <body>
    <p>Redirecting to <a href="clock.html">Live H–M–S Clock</a>…</p>
  </body>
</html>
