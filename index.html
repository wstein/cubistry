<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f5f3eb" />
    <title>Cubistry · Counter</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23254f43'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <main>
      <header>
        <a class="brand" href="./" aria-label="Cubistry counter home"
          ><span class="brand-mark">▦</span> CUBISTRY</a
        >
        <div class="application-choice">
          <label for="application">Cube / application</label>
          <select id="application">
            <option value="certified">Counter 0–99</option>
          </select>
        </div>
      </header>
      <section class="workspace" aria-label="Cube counter">
        <div class="cube-card">
          <div class="viewer-stage">
            <div id="cube" aria-busy="true"></div>
            <span id="viewer-hint">Drag to rotate · Scroll to zoom</span>
          </div>
          <div class="cube-footer">
            <section
              class="counter-stats"
              aria-label="Counter status and moves"
            >
              <p id="status" role="status" aria-live="polite">
                Preparing the fixed print…
              </p>
              <div class="stats-summary">
                <dl class="move-summary">
                  <div>
                    <dt>Session moves</dt>
                    <dd
                      id="session-moves"
                      aria-live="off"
                      aria-label="Session committed moves (HTM)"
                    >
                      0
                    </dd>
                  </div>
                  <div>
                    <dt>Current sequence</dt>
                    <dd>
                      <span
                        id="move-progress"
                        role="progressbar"
                        aria-label="Committed moves (HTM)"
                        aria-live="off"
                        aria-valuemin="0"
                        aria-valuemax="0"
                        aria-valuenow="0"
                        aria-valuetext="No move sequence planned"
                        >0 / 0 moves</span
                      >
                    </dd>
                  </div>
                </dl>
                <button
                  id="reset-session-moves"
                  class="quiet"
                  type="button"
                  disabled
                >
                  Reset session moves
                </button>
              </div>
            </section>
            <label class="speed-control" for="rotation-speed"
              >Rotation Speed
              <output id="speed-label">100 ms per HTM move</output></label
            >
            <input
              id="rotation-speed"
              type="range"
              min="0"
              max="5"
              step="1"
              value="4"
              list="speed-marks"
              aria-describedby="speed-label"
            />
            <datalist id="speed-marks">
              <option value="0" label="2 s"></option>
              <option value="1" label="1 s"></option>
              <option value="2" label="500 ms"></option>
              <option value="3" label="250 ms"></option>
              <option value="4" label="100 ms"></option>
              <option value="5" label="50 ms"></option>
            </datalist>
          </div>
        </div>
        <aside class="controls" aria-label="Counter controls">
          <h1>Counter</h1>
          <form id="jump-form">
            <label for="value">Target 0–99</label>
            <input
              id="value"
              type="text"
              inputmode="numeric"
              value="0"
              aria-describedby="bounds"
            />
            <div class="target-actions">
              <button id="set" type="submit">Set</button
              ><button
                id="run"
                type="button"
                class="primary"
                aria-pressed="false"
              >
                Run
              </button>
            </div>
          </form>
          <p id="bounds" class="small">
            Set a value directly, or Run toward it by 1 per second.
          </p>
          <div class="increments" aria-label="Manual steps">
            <button data-delta="-10">−10</button
            ><button data-delta="-1">−1</button
            ><button data-delta="1">+1</button
            ><button data-delta="10">+10</button>
          </div>
          <div class="options">
            <label class="check"
              ><input id="wrap" type="checkbox" /> Wrap 99 ↔ 0</label
            ><label class="check"
              ><input id="format" type="checkbox" checked /> Leading Zero</label
            >
          </div>
          <p class="small">
            Leading Zero shows or hides only the leading 0. The layout, value,
            and moves stay the same.
          </p>
          <p id="error" role="alert"></p>
        </aside>
      </section>
    </main>
    <script type="module" src="/src/main.mjs"></script>
  </body>
</html>
